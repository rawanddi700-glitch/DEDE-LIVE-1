<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEDE LIVE - منصة الدردشة الصوتية والخاصة</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    body { font-family: 'Tajawal', sans-serif; }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.3); opacity: 0; }
    }
    .floating-emoji {
      animation: floatUp 1.5s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_BASE_URL = "https://yhsehpcosswgehonzzcq.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_cbpNPEi4PWw8aKIjPN7HMg_zN2sChHr";

    const HEADERS = {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': 'return=representation'
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('dede_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      
      const [rooms, setRooms] = useState([]);
      const [loadingRooms, setLoadingRooms] = useState(true);
      
      const [activeRoom, setActiveRoom] = useState(null);
      const [roomSeatsData, setRoomSeatsData] = useState([]);
      const [isMuted, setIsMuted] = useState(false);
      const [isHandRaised, setIsHandRaised] = useState(false);
      
      const [roomChat, setRoomChat] = useState([]);
      const [chatInput, setChatInput] = useState('');
      const [floatingEmojis, setFloatingEmojis] = useState([]);

      const [searchQuery, setSearchQuery] = useState('');
      const [searchResult, setSearchResult] = useState(null);
      const [searchError, setSearchError] = useState('');

      // حالات الصداقة والدردشة الخاصة
      const [friendRequests, setFriendRequests] = useState([]);
      const [friendsList, setFriendsList] = useState([]);
      const [showFriendsModal, setShowFriendsModal] = useState(false);
      const [activePrivateFriend, setActivePrivateFriend] = useState(null);
      const [privateMessages, setPrivateMessages] = useState([]);
      const [privateChatInput, setPrivateChatInput] = useState('');
      const [friendActionMsg, setFriendActionMsg] = useState('');

      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [isSignup, setIsSignup] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const [showCreateRoomModal, setShowCreateRoomModal] = useState(false);
      const [roomTitle, setRoomTitle] = useState('');
      const [roomCategory, setRoomCategory] = useState('حوار ونقاش');
      const [roomSeats, setRoomSeats] = useState(8);
      const [createRoomError, setCreateRoomError] = useState('');

      const [showProfileModal, setShowProfileModal] = useState(false);
      const [editName, setEditName] = useState('');
      const [editAvatar, setEditAvatar] = useState('');
      const [profileUpdateMsg, setProfileUpdateMsg] = useState('');

      useEffect(() => {
        fetchRooms();
        if (currentUser) {
          refreshUserData();
          fetchFriendData();
        }
      }, []);

      useEffect(() => {
        if (currentUser) {
          const interval = setInterval(() => {
            fetchFriendData();
            if (activePrivateFriend) {
              fetchPrivateMessages(activePrivateFriend.id);
            }
          }, 3000);
          return () => clearInterval(interval);
        }
      }, [currentUser, activePrivateFriend]);

      const refreshUserData = async () => {
        if (!currentUser || !currentUser.email) return;
        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/users?email=eq.${encodeURIComponent(currentUser.email)}`, { headers: HEADERS });
          if (res.ok) {
            const data = await res.json();
            if (data.length > 0) {
              setCurrentUser(data[0]);
              localStorage.setItem('dede_user', JSON.stringify(data[0]));
            }
          }
        } catch (err) {
          console.error("Refresh user error:", err);
        }
      };

      // جلب الطلبات والأصدقاء
      const fetchFriendData = async () => {
        if (!currentUser) return;
        try {
          // جلب الطلبات الواردة
          const reqRes = await fetch(`${SUPABASE_BASE_URL}/friendships?receiver_id=eq.${currentUser.id}&status=eq.pending`, { headers: HEADERS });
          if (reqRes.ok) {
            const reqs = await reqRes.json();
            setFriendRequests(reqs);
          }

          // جلب الأصدقاء المقبولين
          const friendsRes = await fetch(`${SUPABASE_BASE_URL}/friendships?or=(sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id})&status=eq.accepted`, { headers: HEADERS });
          if (friendsRes.ok) {
            const accepted = await friendsRes.json();
            setFriendsList(accepted);
          }
        } catch (err) {
          console.error("Friend data error:", err);
        }
      };

      // إرسال طلب صداقة
      const sendFriendRequest = async (targetUser) => {
        if (!currentUser) return alert("سجل دخولك أولاً لإرسال طلب صداقة!");
        if (targetUser.id === currentUser.id) return alert("لا يمكنك إرسال طلب صداقة لنفسك!");

        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/friendships`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify({
              sender_id: currentUser.id,
              sender_name: currentUser.username,
              sender_avatar: currentUser.avatar,
              receiver_id: targetUser.id,
              status: 'pending'
            })
          });

          if (res.ok) {
            alert(`تم إرسال طلب الصداقة إلى ${targetUser.username} بنجاح!`);
          } else {
            alert("تم إرسال طلب بالفعل أو حدث خطأ.");
          }
        } catch (err) {
          alert("فشل في إرسال طلب الصداقة.");
        }
      };

      // قبول أو رفض الطلب
      const handleRequestAction = async (requestId, newStatus) => {
        try {
          if (newStatus === 'accepted') {
            await fetch(`${SUPABASE_BASE_URL}/friendships?id=eq.${requestId}`, {
              method: 'PATCH',
              headers: HEADERS,
              body: JSON.stringify({ status: 'accepted' })
            });
          } else {
            await fetch(`${SUPABASE_BASE_URL}/friendships?id=eq.${requestId}`, {
              method: 'DELETE',
              headers: HEADERS
            });
          }
          fetchFriendData();
        } catch (err) {
          console.error("Error updating request:", err);
        }
      };

      // جلب الدردشة الخاصة
      const fetchPrivateMessages = async (friendId) => {
        if (!currentUser) return;
        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/private_messages?or=(and(sender_id.eq.${currentUser.id},receiver_id.eq.${friendId}),and(sender_id.eq.${friendId},receiver_id.eq.${currentUser.id}))&order=created_at.asc`, { headers: HEADERS });
          if (res.ok) {
            const msgs = await res.json();
            setPrivateMessages(msgs);
          }
        } catch (err) {
          console.error("Fetch private msgs error:", err);
        }
      };

      // إرسال رسالة خاصة
      const sendPrivateMessage = async (e) => {
        e.preventDefault();
        if (!privateChatInput.trim() || !activePrivateFriend) return;

        const newMsg = {
          sender_id: currentUser.id,
          receiver_id: activePrivateFriend.id,
          text: privateChatInput.trim()
        };

        try {
          await fetch(`${SUPABASE_BASE_URL}/private_messages`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(newMsg)
          });
          setPrivateChatInput('');
          fetchPrivateMessages(activePrivateFriend.id);
        } catch (err) {
          console.error("Send msg error:", err);
        }
      };

      useEffect(() => {
        if (currentUser) {
          setEditName(currentUser.username || '');
          setEditAvatar(currentUser.avatar || '');
        }
      }, [currentUser]);

      const fetchRooms = async () => {
        setLoadingRooms(true);
        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/rooms?select=*`, { headers: HEADERS });
          if (response.ok) {
            const data = await response.json();
            setRooms(data);
          }
        } catch (err) {
          console.error("Error fetching rooms:", err);
        } finally {
          setLoadingRooms(false);
        }
      };

      const handleGlobalSearch = async (e) => {
        e.preventDefault();
        setSearchError('');
        setSearchResult(null);

        const query = searchQuery.trim();
        if (!query) return;

        const foundRoom = rooms.find(r => r.id.toLowerCase() === query.toLowerCase());
        if (foundRoom) {
          setSearchResult({ type: 'room', data: foundRoom });
          return;
        }

        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/users?or=(id.ilike.*${query}*,username.ilike.*${query}*)`, { headers: HEADERS });
          if (res.ok) {
            const users = await res.json();
            if (users.length > 0) {
              setSearchResult({ type: 'user', data: users[0] });
              return;
            }
          }
        } catch (err) {
          console.error("Search user error:", err);
        }

        setSearchError('عذراً، لم يتم العثور على أي مطابقة للـ ID أو الاسم المدخل.');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setEditAvatar(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        setProfileUpdateMsg('جاري الحفظ...');

        const updatedData = {
          username: editName.trim(),
          avatar: editAvatar || currentUser.avatar
        };

        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/users?email=eq.${encodeURIComponent(currentUser.email)}`, {
            method: 'PATCH',
            headers: HEADERS,
            body: JSON.stringify(updatedData)
          });

          if (response.ok) {
            const newUserObj = { ...currentUser, ...updatedData };
            setCurrentUser(newUserObj);
            localStorage.setItem('dede_user', JSON.stringify(newUserObj));
            setShowProfileModal(false);
            setProfileUpdateMsg('');
          } else {
            setProfileUpdateMsg("تعذر الحفظ");
          }
        } catch (err) {
          setProfileUpdateMsg("فشل الاتصال");
        }
      };

      const enterRoom = (room) => {
        setActiveRoom(room);
        const seatsCount = room.max_seats || 8;
        const initialSeats = Array.from({ length: seatsCount }, (_, i) => {
          if (i === 0) {
            return { 
              index: 0, 
              user: { name: room.host_name, avatar: room.host_avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200", id: room.host_id, role: 'مضيف الغرفة' }, 
              isHost: true 
            };
          }
          return { index: i, user: null, isHost: false };
        });
        setRoomSeatsData(initialSeats);
        setRoomChat([
          { id: 1, sender: 'النظام 🤖', text: `أهلاً بك في روم "${room.title}".` }
        ]);
        setIsMuted(false);
        setIsHandRaised(false);
      };

      const claimSeat = (index) => {
        if (!currentUser) return alert("يجب تسجيل الدخول أولاً للصعود إلى المايك!");
        const updated = [...roomSeatsData];
        if (updated[index].user) return;

        const oldIndex = updated.findIndex(s => s.user?.id === currentUser.id);
        if (oldIndex !== -1) updated[oldIndex].user = null;

        updated[index].user = { 
          name: currentUser.username, 
          avatar: currentUser.avatar, 
          id: currentUser.id, 
          role: currentUser.role || 'عضو' 
        };
        setRoomSeatsData(updated);
        setIsHandRaised(false);
      };

      const leaveSeat = () => {
        const updated = [...roomSeatsData];
        const idx = updated.findIndex(s => s.user?.id === currentUser.id);
        if (idx !== -1 && !updated[idx].isHost) {
          updated[idx].user = null;
          setRoomSeatsData(updated);
        }
      };

      const kickUser = (index) => {
        if (activeRoom.host_id !== currentUser?.id) return alert("فقط مضيف الغرفة يمكنه طرد الأعضاء!");
        const updated = [...roomSeatsData];
        if (updated[index].isHost) return alert("لا يمكنك طرد مضيف الغرفة!");
        const target = updated[index].user;
        if (target) {
          updated[index].user = null;
          setRoomSeatsData(updated);
          setRoomChat(prev => [...prev, { id: Date.now(), sender: 'تنبيه ⚠️', text: `تم طرد ${target.name} من المايك.` }]);
        }
      };

      const sendRoomChat = (e) => {
        e.preventDefault();
        if (!chatInput.trim() || !currentUser) return;
        setRoomChat(prev => [...prev, { id: Date.now(), sender: currentUser.username, text: chatInput }]);
        setChatInput('');
      };

      const sendEmoji = (emoji) => {
        const id = Date.now();
        setFloatingEmojis(prev => [...prev, { id, emoji }]);
        setTimeout(() => {
          setFloatingEmojis(prev => prev.filter(item => item.id !== id));
        }, 1500);
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        const permanentId = `ID-${Math.floor(100000 + Math.random() * 900000)}`;
        const userObj = {
          id: permanentId,
          username: username || email.split('@')[0],
          email: email,
          password_hash: password,
          coins: 0,
          level: 1,
          role: 'عضو',
          avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200"
        };

        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/users`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(userObj)
          });

          if (!response.ok) {
            const errData = await response.json();
            setErrorMsg("خطأ: " + (errData.message || response.statusText));
            return;
          }
        } catch (err) {
          setErrorMsg("فشل الاتصال بقاعدة البيانات");
          return;
        }

        setCurrentUser(userObj);
        localStorage.setItem('dede_user', JSON.stringify(userObj));
        setShowAuthModal(false);
      };

      const handleCreateRoom = async (e) => {
        e.preventDefault();
        setCreateRoomError('');

        if (!currentUser) {
          setCreateRoomError('يجب تسجيل الدخول أولاً');
          return;
        }

        const newRoom = {
          id: `ROOM-${Math.floor(1000 + Math.random() * 9000)}`,
          host_id: currentUser.id,
          host_name: currentUser.username,
          host_avatar: currentUser.avatar,
          title: roomTitle,
          category: roomCategory,
          cover_image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=600",
          max_seats: parseInt(roomSeats),
          listeners_count: 1
        };

        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/rooms`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(newRoom)
          });

          if (response.ok) {
            setShowCreateRoomModal(false);
            setRoomTitle('');
            fetchRooms();
          } else {
            const errData = await response.json();
            setCreateRoomError("خطأ من السيرفر: " + (errData.message || "تأكد من البيانات"));
          }
        } catch (err) {
          setCreateRoomError("فشل في الاتصال أثناء إنشاء الروم");
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('dede_user');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* الشريط العلوي */}
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4 sticky top-0 z-50">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setActiveRoom(null); setSearchResult(null); setSearchQuery(''); }}>
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-black text-xl shadow-lg shadow-purple-500/30">
                🎙️
              </div>
              <div>
                <h1 className="text-xl font-black bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">DEDE LIVE</h1>
                <p className="text-[10px] text-purple-400 font-bold">بث مباشر ورومات حية</p>
              </div>
            </div>

            {/* محرك البحث */}
            <form onSubmit={handleGlobalSearch} className="flex items-center gap-2 w-full md:w-auto">
              <input 
                type="text" 
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                placeholder="ابحث بـ ID مستخدم أو ID روم..." 
                className="w-full md:w-64 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500"
              />
              <button type="submit" className="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition-all whitespace-nowrap">
                🔍 بحث
              </button>
            </form>

            <div className="flex items-center gap-3">
              {currentUser ? (
                <>
                  <button 
                    onClick={() => { setCreateRoomError(''); setShowCreateRoomModal(true); }} 
                    className="bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-lg transition-all flex items-center gap-1">
                    <span>➕</span> إنشاء روم
                  </button>

                  {/* زر الأصدقاء والطلبات */}
                  <button 
                    onClick={() => setShowFriendsModal(true)} 
                    className="relative bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl border border-slate-700 text-xs font-bold flex items-center gap-1">
                    <span>🤝 الأصدقاء</span>
                    {friendRequests.length > 0 && (
                      <span className="bg-rose-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center animate-bounce">
                        {friendRequests.length}
                      </span>
                    )}
                  </button>

                  <div className="flex items-center gap-3 bg-slate-800/90 px-4 py-2 rounded-2xl border border-slate-700 shadow-xl">
                    <img src={currentUser.avatar} className="w-10 h-10 rounded-full object-cover ring-2 ring-purple-500 shadow" />
                    <div className="text-right">
                      <div className="flex items-center gap-2">
                        <p className="text-sm font-black text-white tracking-wide">{currentUser.username}</p>
                        {currentUser.role && (
                          <span className="bg-rose-500/20 text-rose-400 text-[10px] px-2 py-0.5 rounded-md font-black border border-rose-500/40 shadow-sm">
                            {currentUser.role}
                          </span>
                        )}
                      </div>
                      <p className="text-xs text-rose-500 font-mono font-black tracking-wider mt-0.5">{currentUser.id}</p>
                    </div>
                    <button onClick={() => { refreshUserData(); setShowProfileModal(true); }} title="تعديل الملف الشخصي" className="mr-2 text-slate-300 hover:text-white bg-slate-700 hover:bg-slate-600 p-2 rounded-full text-xs transition-all shadow">
                      ✏️
                    </button>
                  </div>

                  <button onClick={handleLogout} className="text-xs text-rose-400 bg-rose-500/10 hover:bg-rose-500 hover:text-white px-3 py-2 rounded-xl border border-rose-500/20 transition-all font-bold">
                    خروج
                  </button>
                </>
              ) : (
                <button onClick={() => setShowAuthModal(true)} className="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-lg transition-all">
                  تسجيل الدخول / حساب جديد
                </button>
              )}
            </div>
          </header>

          <main className="max-w-6xl w-full mx-auto p-6 flex-1">

            {/* عرض نتائج البحث + زر إرسال طلب الصداقة */}
            {searchResult ? (
              <div className="bg-slate-900 border border-purple-500/40 rounded-3xl p-6 mb-8 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-sm font-bold text-purple-400">نتيجة البحث عن: "{searchQuery}"</h3>
                  <button onClick={() => { setSearchResult(null); setSearchQuery(''); }} className="text-xs text-slate-400 hover:text-white">✕ إغلاق</button>
                </div>

                {searchResult.type === 'room' ? (
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                    <div className="flex items-center gap-4">
                      <img src={searchResult.data.cover_image || "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=200"} className="w-16 h-16 rounded-xl object-cover" />
                      <div>
                        <span className="bg-purple-500/20 text-purple-300 text-[10px] font-bold px-2 py-0.5 rounded-full">{searchResult.data.category}</span>
                        <h4 className="text-white font-bold text-base mt-1">{searchResult.data.title}</h4>
                        <p className="text-slate-400 text-xs">المضيف: {searchResult.data.host_name} | ID الغرفة: <span className="font-mono text-purple-300">{searchResult.data.id}</span></p>
                      </div>
                    </div>
                    <button onClick={() => { enterRoom(searchResult.data); setSearchResult(null); }} className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs">
                      دخول الروم ←
                    </button>
                  </div>
                ) : (
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                    <div className="flex items-center gap-4">
                      <img src={searchResult.data.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200"} className="w-16 h-16 rounded-full object-cover ring-2 ring-purple-500" />
                      <div>
                        <div className="flex items-center gap-2">
                          <h4 className="text-white font-black text-lg">{searchResult.data.username}</h4>
                          {searchResult.data.role && (
                            <span className="bg-rose-500/20 text-rose-400 text-xs px-2 py-0.5 rounded-md font-black border border-rose-500/40">
                              {searchResult.data.role}
                            </span>
                          )}
                        </div>
