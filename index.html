<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEDE LIVE - منصة الدردشة الصوتية</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    body { font-family: 'Tajawal', sans-serif; }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.3); opacity: 0; }
    }
    .floating-emoji {
      animation: floatUp 1.5s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_BASE_URL = "https://yhsehpcosswgehonzzcq.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_cbpNPEi4PWw8aKIjPN7HMg_zN2sChHr";

    const HEADERS = {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': 'return=representation'
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('dede_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      
      const [rooms, setRooms] = useState([]);
      const [loadingRooms, setLoadingRooms] = useState(true);
      
      // حالة الروم النشطة
      const [activeRoom, setActiveRoom] = useState(null);
      const [roomSeatsData, setRoomSeatsData] = useState([]);
      const [isMuted, setIsMuted] = useState(false);
      const [isHandRaised, setIsHandRaised] = useState(false);
      
      // شات الروم والتفاعلات
      const [roomChat, setRoomChat] = useState([]);
      const [chatInput, setChatInput] = useState('');
      const [floatingEmojis, setFloatingEmojis] = useState([]);

      // محرك البحث الشامل
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResult, setSearchResult] = useState(null);
      const [searchError, setSearchError] = useState('');

      // النوافذ
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [isSignup, setIsSignup] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const [showCreateRoomModal, setShowCreateRoomModal] = useState(false);
      const [roomTitle, setRoomTitle] = useState('');
      const [roomCategory, setRoomCategory] = useState('حوار ونقاش');
      const [roomSeats, setRoomSeats] = useState(8);
      const [createRoomError, setCreateRoomError] = useState('');
      const [showPrivacyModal, setShowPrivacyModal] = useState(false);

      // تعديل الملف الشخصي
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [editName, setEditName] = useState('');
      const [editAvatar, setEditAvatar] = useState('');

      useEffect(() => {
        fetchRooms();
      }, []);

      useEffect(() => {
        if (currentUser) {
          setEditName(currentUser.username || '');
          setEditAvatar(currentUser.avatar || '');
        }
      }, [currentUser]);

      const fetchRooms = async () => {
        setLoadingRooms(true);
        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/rooms?select=*`, { headers: HEADERS });
          if (response.ok) {
            const data = await response.json();
            setRooms(data);
          }
        } catch (err) {
          console.error("Error fetching rooms:", err);
        } finally {
          setLoadingRooms(false);
        }
      };

      // تنفيذ البحث الشامل (عن ID مستخدم أو ID روم)
      const handleGlobalSearch = async (e) => {
        e.preventDefault();
        setSearchError('');
        setSearchResult(null);

        const query = searchQuery.trim();
        if (!query) return;

        // 1. البحث أولاً في الغرف بالحاوية المحلية أو بالـ ID
        const foundRoom = rooms.find(r => r.id.toLowerCase() === query.toLowerCase());
        if (foundRoom) {
          setSearchResult({ type: 'room', data: foundRoom });
          return;
        }

        // 2. البحث في جدول المستخدمين (Users) بالـ ID أو بالاسم
        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/users?or=(id.ilike.*${query}*,username.ilike.*${query}*)`, { headers: HEADERS });
          if (res.ok) {
            const users = await res.json();
            if (users.length > 0) {
              setSearchResult({ type: 'user', data: users[0] });
              return;
            }
          }
        } catch (err) {
          console.error("Search user error:", err);
        }

        setSearchError('عذراً، لم يتم العثور على أي مطابقة للـ ID أو الاسم المدخل.');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setEditAvatar(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        if (!currentUser) return;

        const updatedUser = {
          ...currentUser,
          username: editName,
          avatar: editAvatar || currentUser.avatar
        };

        setCurrentUser(updatedUser);
        localStorage.setItem('dede_user', JSON.stringify(updatedUser));
        setShowProfileModal(false);
      };

      const enterRoom = (room) => {
        setActiveRoom(room);
        const seatsCount = room.max_seats || 8;
        const initialSeats = Array.from({ length: seatsCount }, (_, i) => {
          if (i === 0) {
            return { index: 0, user: { name: room.host_name, avatar: room.host_avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200", id: room.host_id }, isHost: true };
          }
          return { index: i, user: null, isHost: false };
        });
        setRoomSeatsData(initialSeats);
        setRoomChat([
          { id: 1, sender: 'النظام 🤖', text: `أهلاً بك في روم "${room.title}". استمتع بالحديث والصوت!` }
        ]);
        setIsMuted(false);
        setIsHandRaised(false);
      };

      const claimSeat = (index) => {
        if (!currentUser) return alert("يجب تسجيل الدخول أولاً للصعود إلى المايك!");
        const updated = [...roomSeatsData];
        if (updated[index].user) return;

        const oldIndex = updated.findIndex(s => s.user?.id === currentUser.id);
        if (oldIndex !== -1) updated[oldIndex].user = null;

        updated[index].user = { name: currentUser.username, avatar: currentUser.avatar, id: currentUser.id };
        setRoomSeatsData(updated);
        setIsHandRaised(false);
      };

      const leaveSeat = () => {
        const updated = [...roomSeatsData];
        const idx = updated.findIndex(s => s.user?.id === currentUser.id);
        if (idx !== -1 && !updated[idx].isHost) {
          updated[idx].user = null;
          setRoomSeatsData(updated);
        }
      };

      const kickUser = (index) => {
        if (activeRoom.host_id !== currentUser?.id) return alert("فقط مضيف الغرفة يمكنه طرد الأعضاء!");
        const updated = [...roomSeatsData];
        if (updated[index].isHost) return alert("لا يمكنك طرد مضيف الغرفة!");
        const target = updated[index].user;
        if (target) {
          updated[index].user = null;
          setRoomSeatsData(updated);
          setRoomChat(prev => [...prev, { id: Date.now(), sender: 'تنبيه ⚠️', text: `تم طرد ${target.name} من المايك بواسطة المضيف.` }]);
        }
      };

      const sendRoomChat = (e) => {
        e.preventDefault();
        if (!chatInput.trim() || !currentUser) return;
        setRoomChat(prev => [...prev, { id: Date.now(), sender: currentUser.username, text: chatInput }]);
        setChatInput('');
      };

      const sendEmoji = (emoji) => {
        const id = Date.now();
        setFloatingEmojis(prev => [...prev, { id, emoji }]);
        setTimeout(() => {
          setFloatingEmojis(prev => prev.filter(item => item.id !== id));
        }, 1500);
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        const permanentId = `ID-${Math.floor(100000 + Math.random() * 900000)}`;
        const userObj = {
          id: permanentId,
          username: username || email.split('@')[0],
          email: email,
          password_hash: password,
          coins: 0,
          level: 1,
          avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200"
        };

        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/users`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(userObj)
          });

          if (!response.ok) {
            const errData = await response.json();
            setErrorMsg("خطأ: " + (errData.message || response.statusText));
            return;
          }
        } catch (err) {
          setErrorMsg("فشل الاتصال بقاعدة البيانات");
          return;
        }

        setCurrentUser(userObj);
        localStorage.setItem('dede_user', JSON.stringify(userObj));
        setShowAuthModal(false);
      };

      const handleCreateRoom = async (e) => {
        e.preventDefault();
        setCreateRoomError('');

        if (!currentUser) {
          setCreateRoomError('يجب تسجيل الدخول أولاً');
          return;
        }

        const newRoom = {
          id: `ROOM-${Math.floor(1000 + Math.random() * 9000)}`,
          host_id: currentUser.id,
          host_name: currentUser.username,
          host_avatar: currentUser.avatar,
          title: roomTitle,
          category: roomCategory,
          cover_image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=600",
          max_seats: parseInt(roomSeats),
          listeners_count: 1
        };

        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/rooms`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(newRoom)
          });

          if (response.ok) {
            setShowCreateRoomModal(false);
            setRoomTitle('');
            fetchRooms();
          } else {
            const errData = await response.json();
            setCreateRoomError("خطأ من السيرفر: " + (errData.message || "تأكد من البيانات"));
          }
        } catch (err) {
          setCreateRoomError("فشل في الاتصال أثناء إنشاء الروم");
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('dede_user');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* الشريط العلوي */}
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4 sticky top-0 z-50">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setActiveRoom(null); setSearchResult(null); setSearchQuery(''); }}>
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-black text-xl shadow-lg shadow-purple-500/30">
                🎙️
              </div>
              <div>
                <h1 className="text-xl font-black bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">DEDE LIVE</h1>
                <p className="text-[10px] text-purple-400 font-bold">بث مباشر ورومات حية</p>
              </div>
            </div>

            {/* محرك البحث السريع بالآيدي */}
            <form onSubmit={handleGlobalSearch} className="flex items-center gap-2 w-full md:w-auto">
              <div className="relative flex-1 md:w-64">
                <input 
                  type="text" 
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="ابحث بـ ID مستخدم أو ID روم..." 
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500"
                />
              </div>
              <button type="submit" className="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition-all whitespace-nowrap">
                🔍 بحث
              </button>
            </form>

            <div className="flex items-center gap-3">
              {currentUser ? (
                <>
                  <button 
                    onClick={() => { setCreateRoomError(''); setShowCreateRoomModal(true); }} 
                    className="bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-lg transition-all flex items-center gap-1">
                    <span>➕</span> إنشاء روم
                  </button>

                  <div className="bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1.5 rounded-full text-xs font-bold hidden sm:block">
                    💰 {currentUser.coins || 0} عملة
                  </div>

                  <div className="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                    <img src={currentUser.avatar} className="w-6 h-6 rounded-full object-cover ring-2 ring-purple-500" />
                    <div className="text-right">
                      <p className="text-xs font-bold text-white">{currentUser.username}</p>
                      <p className="text-[10px] text-purple-400 font-mono">{currentUser.id}</p>
                    </div>
                    <button 
                      onClick={() => setShowProfileModal(true)} 
                      title="تعديل الملف الشخصي"
                      className="mr-1 text-slate-400 hover:text-white bg-slate-700 p-1 rounded-full text-[10px]">
                      ✏️
                    </button>
                  </div>

                  <button onClick={handleLogout} className="text-xs text-rose-400 bg-rose-500/10 hover:bg-rose-500 hover:text-white px-3 py-1.5 rounded-xl border border-rose-500/20 transition-all">
                    خروج
                  </button>
                </>
              ) : (
                <button onClick={() => setShowAuthModal(true)} className="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-lg transition-all">
                  تسجيل الدخول / حساب جديد
                </button>
              )}
            </div>
          </header>

          {/* محتوى الصفحة الرئيسية أو داخل الروم */}
          <main className="max-w-6xl w-full mx-auto p-6 flex-1">

            {/* نتائج البحث */}
            {searchResult ? (
              <div className="bg-slate-900 border border-purple-500/40 rounded-3xl p-6 mb-8 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-sm font-bold text-purple-400">نتيجة البحث عن: "{searchQuery}"</h3>
                  <button onClick={() => { setSearchResult(null); setSearchQuery(''); }} className="text-xs text-slate-400 hover:text-white">✕ إغلاق البحث</button>
                </div>

                {searchResult.type === 'room' ? (
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                    <div className="flex items-center gap-4">
                      <img src={searchResult.data.cover_image || "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=200"} className="w-16 h-16 rounded-xl object-cover" />
                      <div>
                        <span className="bg-purple-500/20 text-purple-300 text-[10px] font-bold px-2 py-0.5 rounded-full">{searchResult.data.category}</span>
                        <h4 className="text-white font-bold text-base mt-1">{searchResult.data.title}</h4>
                        <p className="text-slate-400 text-xs">المضيف: {searchResult.data.host_name} | ID الغرفة: <span className="font-mono text-purple-300">{searchResult.data.id}</span></p>
                      </div>
                    </div>
                    <button onClick={() => { enterRoom(searchResult.data); setSearchResult(null); }} className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs">
                      دخول الروم ←
                    </button>
                  </div>
                ) : (
                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                    <div className="flex items-center gap-4">
                      <img src={searchResult.data.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200"} className="w-16 h-16 rounded-full object-cover ring-2 ring-purple-500" />
                      <div>
                        <h4 className="text-white font-bold text-base">{searchResult.data.username}</h4>
                        <p className="text-slate-400 text-xs">ID المستخدم: <span className="font-mono text-purple-300">{searchResult.data.id}</span> | البريد: {searchResult.data.email}</p>
                      </div>
                    </div>
                    <div className="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-bold">
                      💰 {searchResult.data.coins || 0} عملة
                    </div>
                  </div>
                )}
              </div>
            ) : searchError ? (
              <div className="bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs p-4 rounded-2xl mb-8 text-center font-bold">
                {searchError}
                <button onClick={() => { setSearchError(''); setSearchQuery(''); }} className="block mx-auto mt-2 text-purple-400 underline">إعادة المحاولة</button>
              </div>
            ) : null}

            {activeRoom ? (
              /* واجهة الروم الحية */
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative">
                <div className="flex items-center justify-between pb-6 border-b border-slate-800 mb-6">
                  <div>
                    <span className="bg-purple-500/20 text-purple-300 text-xs font-bold px-3 py-1 rounded-full border border-purple-400/30 inline-block mb-1">
                      {activeRoom.category}
                    </span>
                    <h2 className="text-2xl font-black text-white">{activeRoom.title}</h2>
                    <p className="text-xs text-slate-400">المضيف: <span className="text-purple-400 font-bold">{activeRoom.host_name}</span> | ID الغرفة: <span className="font-mono text-purple-300">{activeRoom.id}</span></p>
                  </div>
                  <button onClick={() => setActiveRoom(null)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold">
                    ← خروج من الروم
                  </button>
                </div>

                {/* مقاعد المايكات */}
                <div className="mb-8">
                  <h3 className="text-xs font-bold text-slate-400 mb-3">مقاعد المايكات ({activeRoom.max_seats || 8}) - انقر على أي مقعد فارغ للصعود:</h3>
                  <div className="grid grid-cols-4 sm:grid-cols-4 md:grid-cols-8 gap-4">
                    {roomSeatsData.map((seat) => (
                      <div key={seat.index} className="flex flex-col items-center">
                        <div 
                          onClick={() => claimSeat(seat.index)}
                          className={`w-16 h-16 rounded-2xl flex items-center justify-center relative cursor-pointer border transition-all ${
                            seat.user 
                              ? 'bg-slate-800 border-purple-500 shadow-lg shadow-purple-500/20' 
                              : 'bg-slate-950/60 border-slate-800 border-dashed hover:border-purple-400'
                          }`}>
                          {seat.user ? (
                            <>
                              <img src={seat.user.avatar} className="w-full h-full rounded-2xl object-cover" />
                              {seat.isHost && (
                                <span className="absolute -top-2 -right-2 bg-amber-500 text-slate-950 text-[9px] font-black px-1.5 py-0.5 rounded shadow">
                                  👑 مضيف
                                </span>
                              )}
                              {activeRoom.host_id === currentUser?.id && !seat.isHost && (
                                <button onClick={(e) => { e.stopPropagation(); kickUser(seat.index); }} className="absolute -bottom-2 -left-2 bg-rose-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded hover:bg-rose-500">
                                  طرد
                                </button>
                              )}
                            </>
                          ) : (
                            <span className="text-slate-600 text-xs font-bold">{seat.index + 1} 🎙️</span>
                          )}
                        </div>
                        <p className="text-[11px] font-bold text-slate-300 mt-2 truncate max-w-[70px] text-center">
                          {seat.user ? seat.user.name : 'فارغ'}
                        </p>
                      </div>
                    ))}
                  </div>
                </div>

                {/* أزرار التحكم بالمايك والتفاعلات */}
                <div className="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 flex flex-wrap items-center justify-between gap-4 mb-6">
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setIsMuted(!isMuted)} 
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${isMuted ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`}>
                      {isMuted ? '🔇 المايك مكتوم' : '🎙️ المايك مفتوح'}
                    </button>

                    <button 
                      onClick={() => setIsHandRaised(!isHandRaised)} 
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${isHandRaised ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                      ✋ {isHandRaised ? 'تم رفع اليد' : 'رفع اليد'}
                    </button>

                    <button onClick={leaveSeat} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-xl text-xs font-bold">
                      النزول للمستمعين
                    </button>
                  </div>

                  {/* إيموجيات التفاعل */}
                  <div className="flex items-center gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                    {['❤️', '🔥', '🎙️', '👏', '🎉'].map(emoji => (
                      <button key={emoji} onClick={() => sendEmoji(emoji)} className="hover:scale-125 transition-transform text-lg px-2">
                        {emoji}
                      </button>
                    ))}
                  </div>
                </div>

                {/* شات الروم */}
                <div className="bg-slate-950 rounded-2xl border border-slate-800 p-4">
                  <h4 className="text-xs font-bold text-slate-400 mb-3">دردشة الروم المباشرة</h4>
                  <div className="h-36 overflow-y-auto space-y-2 mb-3 p-2 bg-slate-900/50 rounded-xl border border-slate-800/50 text-xs">
                    {roomChat.map(msg => (
                      <div key={msg.id} className="flex items-start gap-2">
                        <span className="font-bold text-purple-400">{msg.sender}:</span>
                        <span className="text-slate-200">{msg.text}</span>
                      </div>
                    ))}
                  </div>

                  <form onSubmit={sendRoomChat} className="flex gap-2">
                    <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="اكتب رسالة..." className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                    <button type="submit" className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2 rounded-xl text-xs">إرسال</button>
                  </form>
                </div>

                {/* تأثير الإيموجيات الطائرة */}
                <div className="absolute bottom-16 right-16 pointer-events-none">
                  {floatingEmojis.map(item => (
                    <div key={item.id} className="floating-emoji text-3xl absolute bottom-0 right-0">
                      {item.emoji}
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              /* قائمة الرومات النشطة الرئيسية */
              <>
                <div className="bg-gradient-to-r from-purple-900 via-indigo-900 to-slate-900 rounded-3xl p-8 border border-purple-500/20 mb-8 shadow-2xl text-center md:text-right flex flex-col md:flex-row justify-between items-center gap-6">
                  <div>
                    <span className="bg-purple-500/20 text-purple-300 text-xs font-bold px-3 py-1 rounded-full border border-purple-400/30 inline-block mb-3">
                      🟢 الرومات المتاحة حالياً من قاعدة البيانات
                    </span>
                    <h2 className="text-3xl md:text-5xl font-black text-white mb-3">انضم إلى <span className="text-purple-400">DEDE LIVE</span></h2>
                    <p className="text-slate-300 text-sm max-w-xl">استخدم حقل البحث في الأعلى للبحث عن أي مستخدم أو غرفة عبر الـ ID الخاص بهم فوراً!</p>
                  </div>

                  {currentUser && (
                    <button onClick={() => { setCreateRoomError(''); setShowCreateRoomModal(true); }} className="bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm px-6 py-3.5 rounded-2xl shadow-xl transition-all whitespace-nowrap">
                      🎙️ افتح روم صوتي الآن
                    </button>
                  )}
                </div>

                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-white">الرومات النشطة ({rooms.length})</h3>
                  <button onClick={fetchRooms} className="text-xs text-purple-400 hover:underline">🔄 تحديث القائمة</button>
                </div>

                {loadingRooms ? (
                  <div className="text-center py-12 text-slate-400 text-xs">جاري جلب الرومات الصوتية...</div>
                ) : rooms.length === 0 ? (
                  <div className="bg-slate-900/50 border border-slate-800 rounded-3xl p-12 text-center">
                    <p className="text-slate-400 text-sm mb-4">لا توجد رومات صوتية مفتوحة حالياً.</p>
                    {currentUser ? (
                      <button onClick={() => { setCreateRoomError(''); setShowCreateRoomModal(true); }} className="bg-purple-600 text-white text-xs font-bold px-5 py-2.5 rounded-xl">كن أول من ينشئ روم!</button>
                    ) : (
                      <p className="text-xs text-purple-400">سجل دخولك لتتمكن من إنشاء أول روم.</p>
                    )}
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {rooms.map(room => (
                      <div key={room.id} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-purple-500/50 transition-all shadow-xl">
                        <div className="relative h-40">
                          <img src={room.cover_image || "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=600"} className="w-full h-full object-cover" />
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950 to-transparent"></div>
                          <span className="absolute top-3 right-3 bg-slate-950/80 text-purple-300 text-[10px] font-bold px-3 py-1 rounded-full border border-slate-700">
                            {room.category}
                          </span>
                          <div className="absolute bottom-3 right-3 left-3 flex items-center gap-3">
                            <img src={room.host_avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200"} className="w-10 h-10 rounded-full ring-2 ring-purple-500" />
                            <div>
                              <h4 className="text-white font-bold text-sm">{room.title}</h4>
                              <p className="text-slate-400 text-xs">المضيف: {room.host_name} | <span className="font-mono text-purple-300">{room.id}</span></p>
                            </div>
                          </div>
                        </div>
                        <div className="p-4 bg-slate-900/90 flex items-center justify-between text-xs text-slate-400 border-t border-slate-800">
                          <span>🎙️ {room.max_seats || 8} مقاعد</span>
                          <button onClick={() => enterRoom(room)} className="bg-purple-600 text-white font-bold px-4 py-1.5 rounded-lg hover:bg-purple-500 transition-all">
                            دخول الروم ←
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}

          </main>

          {/* نافذة تعديل الملف الشخصي */}
          {showProfileModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full relative shadow-2xl">
                <button onClick={() => setShowProfileModal(false)} className="absolute top-4 left-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-black text-white text-center mb-1">تعديل الملف الشخصي</h3>
                <p className="text-xs text-slate-400 text-center mb-6">غير صورتك واسمك بسهولة</p>

                <form onSubmit={handleSaveProfile} className="space-y-4">
                  <div className="flex flex-col items-center gap-3">
                    <img src={editAvatar || currentUser?.avatar} className="w-20 h-20 rounded-full object-cover ring-4 ring-purple-500" />
                    <label className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-3 py-1.5 rounded-xl cursor-pointer">
                      📂 رفع صورة من الهاتف/الكمبيوتر
                      <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                    </label>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">اسم المستخدم</label>
                    <input type="text" value={editName} onChange={e => setEditName(e.target.value)} required className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                  </div>

                  <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg transition-all">
                    حفظ التغييرات
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* نافذة إنشاء روم جديدة */}
          {showCreateRoomModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full relative shadow-2xl">
                <button onClick={() => setShowCreateRoomModal(false)} className="absolute top-4 left-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-black text-white text-center mb-1">إنشاء روم صوتي</h3>
                <p className="text-xs text-slate-400 text-center mb-4">احجز مقعدك وشارك البث مع أصدقائك</p>

                {createRoomError && (
                  <div className="mb-4 bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs p-2.5 rounded-xl text-center font-bold">
                    {createRoomError}
                  </div>
                )}

                <form onSubmit={handleCreateRoom} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">عنوان الروم</label>
                    <input type="text" value={roomTitle} onChange={e => setRoomTitle(e.target.value)} required placeholder="مثال: سهرة وسوالف طرب..." className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">تصنيف الروم</label>
                    <select value={roomCategory} onChange={e => setRoomCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                      <option value="حوار ونقاش">حوار ونقاش</option>
                      <option value="موسيقى وغناء">موسيقى وغناء</option>
                      <option value="ألعاب وجيمينج">ألعاب وجيمينج</option>
                      <option value="تعارف ودردشة">تعارف ودردشة</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">عدد المقاعد (المايكات)</label>
                    <select value={roomSeats} onChange={e => setRoomSeats(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                      <option value="4">4 مقاعد</option>
                      <option value="6">6 مقاعد</option>
                      <option value="8">8 مقاعد</option>
                      <option value="12">12 مقعد</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg transition-all">
                    نشر الروم فوراً
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* نافذة تسجيل الدخول */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full relative shadow-2xl">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 left-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-black text-white text-center mb-1">{isSignup ? 'إنشاء حساب جديد' : 'تسجيل الدخول'}</h3>
                <p className="text-xs text-slate-400 text-center mb-6">احصل على رقم ID ثابت (الرصيد الأولي 0 عملة)</p>

                {errorMsg && (
                  <div className="mb-4 bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs p-2.5 rounded-xl text-center font-bold">
                    {errorMsg}
                  </div>
                )}

                <form onSubmit={handleAuth} className="space-y-4">
                  {isSignup && (
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">اسم المستخدم</label>
                      <input type="text" value={username} onChange={e => setUsername(e.target.value)} required placeholder="اكتب اسمك..." className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                    </div>
                  )}
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">البريد الإلكتروني</label>
                    <input type="email" value={email} onChange={e => setEmail(e.target.value)} required placeholder="email@example.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">كلمة السر</label>
                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} required placeholder="••••••••" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                  </div>
                  <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg transition-all">
                    {isSignup ? 'إنشاء الحساب الآن' : 'دخول فوري'}
                  </button>
                </form>

                <p className="text-center text-xs text-slate-400 mt-4">
                  {isSignup ? 'لديك حساب بالفعل؟ ' : 'ليس لديك حساب؟ '}
                  <button onClick={() => setIsSignup(!isSignup)} className="text-purple-400 font-bold hover:underline">
                    {isSignup ? 'تسجيل الدخول' : 'إنشاء حساب جديد'}
                  </button>
                </p>
              </div>
            </div>
          )}

          {/* نافذة السياسة والخصوصية */}
          {showPrivacyModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-md w-full relative shadow-2xl">
                <button onClick={() => setShowPrivacyModal(false)} className="absolute top-4 left-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-black text-white text-center mb-4">سياسة الخصوصية والاستخدام</h3>
                <p className="text-xs text-slate-300 leading-relaxed mb-4 text-right">
                  نحن في منصة DEDE LIVE نحترم خصوصيتك. البيانات تقتصر على اسم المستخدم والبريد الإلكتروني للتعريف فقط، وتتم حماية الاتصالات بمعايير عالية.
                </p>
                <button onClick={() => setShowPrivacyModal(false)} className="w-full bg-purple-600 text-white font-bold py-2.5 rounded-xl text-xs">
                  إغلاق
                </button>
              </div>
            </div>
          )}

          {/* الفوتر */}
          <footer className="border-t border-slate-800 py-6 bg-slate-900/50 mt-12 text-center text-xs text-slate-400">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <p>DEDE LIVE © 2026 - جميع الحقوق محفوظة</p>
              <div className="flex items-center gap-4">
                <button onClick={() => setShowPrivacyModal(true)} className="hover:text-purple-400 underline">
                  السياسة والخصوصية
                </button>
                <a 
                  href="https://wa.me/963993918672" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-xl font-bold hover:bg-emerald-600 hover:text-white transition-all flex items-center gap-1">
                  <span>💬</span> التواصل مع الدعم (واتساب)
                </a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
