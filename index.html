<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DEDE LIVE - منصة الدردشة الصوتية</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    body { font-family: 'Tajawal', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.3); opacity: 0; }
    }
    .floating-emoji { animation: floatUp 1.5s ease-out forwards; }

    @keyframes bellShake {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(14deg); }
      40% { transform: rotate(-14deg); }
      60% { transform: rotate(8deg); }
      80% { transform: rotate(-8deg); }
      100% { transform: rotate(0deg); }
    }
    .bell-shake { animation: bellShake 0.6s ease-in-out infinite; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="root">
    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #020617; color: #a855f7; font-family: 'Tajawal', sans-serif;">
      <div style="font-size: 36px; margin-bottom: 10px;">🎙️</div>
      <div style="font-size: 16px; font-weight: bold;">جاري تحميل DEDE LIVE...</div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_BASE_URL = "https://yhsehpcosswgehonzzcq.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_cbpNPEi4PWw8aKIjPN7HMg_zN2sChHr";
    const ADMIN_EMAIL = "zzx640616@gmail.com";

    const HEADERS = {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': 'return=representation'
    };

    const playNotificationSound = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const audioCtx = new AudioContext();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('dede_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) { return null; }
      });
      
      const [rooms, setRooms] = useState([]);
      const [loadingRooms, setLoadingRooms] = useState(true);
      const [activeRoom, setActiveRoom] = useState(null);
      const [roomSeatsData, setRoomSeatsData] = useState([]);
      const [isMuted, setIsMuted] = useState(false);
      const [roomChat, setRoomChat] = useState([]);
      const [chatInput, setChatInput] = useState('');
      const [floatingEmojis, setFloatingEmojis] = useState([]);

      const [searchQuery, setSearchQuery] = useState('');
      const [searchResult, setSearchResult] = useState(null);
      const [searchError, setSearchError] = useState('');

      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [isSignup, setIsSignup] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const [showCreateRoomModal, setShowCreateRoomModal] = useState(false);
      const [roomTitle, setRoomTitle] = useState('');
      const [roomCategory, setRoomCategory] = useState('حوار ونقاش');
      const [roomSeats, setRoomSeats] = useState(8);
      const [createRoomError, setCreateRoomError] = useState('');

      const [showProfileModal, setShowProfileModal] = useState(false);
      const [editName, setEditName] = useState('');
      const [editAvatar, setEditAvatar] = useState('');
      const [profileUpdateMsg, setProfileUpdateMsg] = useState('');

      const [showAdminPanel, setShowAdminPanel] = useState(false);
      const [viewingUser, setViewingUser] = useState(null);
      const [friendRequests, setFriendRequests] = useState([]);
      const [friendsList, setFriendsList] = useState([]);
      const [showSocialModal, setShowSocialModal] = useState(false);
      const [activeTab, setActiveTab] = useState('messages');
      const [activePrivateChat, setActivePrivateChat] = useState(null);
      const [privateMessages, setPrivateMessages] = useState([]);
      const [privateMsgInput, setPrivateMsgInput] = useState('');
      const [actionMsg, setActionMsg] = useState('');
      const [friendsLastMessages, setFriendsLastMessages] = useState({});
      const [unreadFriends, setUnreadFriends] = useState({});

      const chatScrollRef = useRef(null);
      const prevReqCountRef = useRef(0);

      useEffect(() => {
        fetchRooms();
        if (currentUser) {
          fetchFriendData();
          const interval = setInterval(() => {
            fetchFriendData();
            if (activePrivateChat) fetchPrivateMessages(activePrivateChat.id);
          }, 4000);
          return () => clearInterval(interval);
        }
      }, [currentUser, activePrivateChat]);

      useEffect(() => {
        if (chatScrollRef.current) {
          chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
        }
      }, [privateMessages]);

      const fetchFriendData = async () => {
        if (!currentUser) return;
        try {
          const reqRes = await fetch(`${SUPABASE_BASE_URL}/friendships?receiver_id=eq.${encodeURIComponent(currentUser.id)}&status=eq.pending`, { headers: HEADERS });
          if (reqRes.ok) {
            const reqs = await reqRes.json();
            if (reqs.length > prevReqCountRef.current) playNotificationSound();
            prevReqCountRef.current = reqs.length;
            setFriendRequests(reqs);
          }

          const friendsRes = await fetch(`${SUPABASE_BASE_URL}/friendships?or=(sender_id.eq.${encodeURIComponent(currentUser.id)},receiver_id.eq.${encodeURIComponent(currentUser.id)})&status=eq.accepted`, { headers: HEADERS });
          if (friendsRes.ok) {
            const fList = await friendsRes.json();
            setFriendsList(fList);

            const lastMsgsMap = {};
            const newUnreadMap = { ...unreadFriends };

            for (let f of fList) {
              const friendId = f.sender_id === currentUser.id ? f.receiver_id : f.sender_id;
              const msgRes = await fetch(`${SUPABASE_BASE_URL}/private_messages?or=(and(sender_id.eq.${encodeURIComponent(currentUser.id)},receiver_id.eq.${encodeURIComponent(friendId)}),and(sender_id.eq.${encodeURIComponent(friendId)},receiver_id.eq.${encodeURIComponent(currentUser.id)}))&order=created_at.desc&limit=1`, { headers: HEADERS });
              
              if (msgRes.ok) {
                const msgData = await msgRes.json();
                if (msgData.length > 0) {
                  const lastMsg = msgData[0];
                  lastMsgsMap[friendId] = lastMsg.message_text;
                  if (lastMsg.sender_id !== currentUser.id && (!activePrivateChat || activePrivateChat.id !== friendId)) {
                    newUnreadMap[friendId] = true;
                  }
                } else {
                  lastMsgsMap[friendId] = "ابدأ المحادثة...";
                }
              }
            }
            setFriendsLastMessages(lastMsgsMap);
            setUnreadFriends(newUnreadMap);
          }
        } catch (err) {}
      };

      const fetchRooms = async () => {
        setLoadingRooms(true);
        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/rooms?select=*`, { headers: HEADERS });
          if (response.ok) {
            const data = await response.json();
            setRooms(data);
          }
        } catch (err) {} finally {
          setLoadingRooms(false);
        }
      };

      const handleGlobalSearch = async (e) => {
        e.preventDefault();
        setSearchError('');
        setSearchResult(null);
        const query = searchQuery.trim();
        if (!query) return;

        const foundRoom = rooms.find(r => r.id.toLowerCase() === query.toLowerCase());
        if (foundRoom) {
          setSearchResult({ type: 'room', data: foundRoom });
          return;
        }

        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/users?or=(id.ilike.*${query}*,username.ilike.*${query}*)`, { headers: HEADERS });
          if (res.ok) {
            const users = await res.json();
            if (users.length > 0) {
              setSearchResult({ type: 'user', data: users[0] });
              return;
            }
          }
        } catch (err) {}
        setSearchError('لم يتم العثور على أي تطابقة.');
      };

      const sendFriendRequest = async (targetUser) => {
        if (!currentUser) return alert("سجل الدخول أولاً!");
        if (currentUser.id === targetUser.id) return alert("لا يمكنك إرسال طلب لنفسك!");
        setActionMsg("جاري الإرسال...");
        try {
          const payload = { sender_id: currentUser.id, sender_name: currentUser.username, receiver_id: targetUser.id, status: 'pending' };
          const res = await fetch(`${SUPABASE_BASE_URL}/friendships`, { method: 'POST', headers: HEADERS, body: JSON.stringify(payload) });
          if (res.ok) setActionMsg("تم إرسال طلب الصداقة! 🟢");
          else setActionMsg("تم إرسال طلب مسبقاً.");
        } catch (e) { setActionMsg("فشل الاتصال."); }
      };

      const respondToFriendRequest = async (reqId, accept) => {
        try {
          if (accept) {
            await fetch(`${SUPABASE_BASE_URL}/friendships?id=eq.${reqId}`, { method: 'PATCH', headers: HEADERS, body: JSON.stringify({ status: 'accepted' }) });
          } else {
            await fetch(`${SUPABASE_BASE_URL}/friendships?id=eq.${reqId}`, { method: 'DELETE', headers: HEADERS });
          }
          fetchFriendData();
        } catch (e) {}
      };

      const openPrivateChat = async (friend) => {
        const friendId = friend.sender_id === currentUser.id ? friend.receiver_id : friend.sender_id;
        const friendName = friend.sender_id === currentUser.id ? (friend.receiver_name || "صديق") : friend.sender_name;
        setActivePrivateChat({ id: friendId, name: friendName });
        setUnreadFriends(prev => { const u = { ...prev }; delete u[friendId]; return u; });
        fetchPrivateMessages(friendId);
      };

      const fetchPrivateMessages = async (friendId) => {
        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/private_messages?or=(and(sender_id.eq.${encodeURIComponent(currentUser.id)},receiver_id.eq.${encodeURIComponent(friendId)}),and(sender_id.eq.${encodeURIComponent(friendId)},receiver_id.eq.${encodeURIComponent(currentUser.id)}))&order=created_at.asc`, { headers: HEADERS });
          if (res.ok) {
            const msgs = await res.json();
            setPrivateMessages(msgs);
          }
        } catch (e) {}
      };

      const sendPrivateMessage = async (textToSend) => {
        if (!textToSend.trim() || !activePrivateChat) return;
        const payload = { sender_id: currentUser.id, receiver_id: activePrivateChat.id, message_text: textToSend.trim() };
        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/private_messages`, { method: 'POST', headers: HEADERS, body: JSON.stringify(payload) });
          if (res.ok) {
            setPrivateMsgInput('');
            fetchPrivateMessages(activePrivateChat.id);
            fetchFriendData();
          }
        } catch (e) {}
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 200;
            let w = img.width, h = img.height;
            if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
            else { if (h > MAX) { w *= MAX / h; h = MAX; } }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            setEditAvatar(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        setProfileUpdateMsg('جاري الحفظ...');
        const newUsername = editName.trim();
        const newAvatar = editAvatar || currentUser.avatar;

        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/users?email=eq.${encodeURIComponent(currentUser.email)}`, {
            method: 'PATCH',
            headers: HEADERS,
            body: JSON.stringify({ username: newUsername, avatar: newAvatar })
          });
          if (response.ok) {
            const updatedUser = { ...currentUser, username: newUsername, avatar: newAvatar };
            setCurrentUser(updatedUser);
            localStorage.setItem('dede_user', JSON.stringify(updatedUser));
            setProfileUpdateMsg('تم الحفظ بنجاح! ✅');
            setTimeout(() => { setShowProfileModal(false); setProfileUpdateMsg(''); }, 1000);
          } else { setProfileUpdateMsg("تعذر الحفظ"); }
        } catch (e) { setProfileUpdateMsg("فشل الاتصال"); }
      };

      const enterRoom = (room) => {
        setActiveRoom(room);
        const seatsCount = room.max_seats || 8;
        const initialSeats = Array.from({ length: seatsCount }, (_, i) => {
          if (i === 0) {
            return { index: 0, user: { name: room.host_name, avatar: room.host_avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200", id: room.host_id, role: 'مضيف الغرفة' }, isHost: true };
          }
          return { index: i, user: null, isHost: false };
        });
        setRoomSeatsData(initialSeats);
        setRoomChat([{ id: 1, sender: 'النظام 🤖', text: `أهلاً بك في روم "${room.title}".` }]);
      };

      const claimSeat = (index) => {
        if (!currentUser) return alert("سجل الدخول أولاً للصعود إلى المايك!");
        const updated = [...roomSeatsData];
        if (updated[index].user) return;
        const oldIndex = updated.findIndex(s => s.user?.id === currentUser.id);
        if (oldIndex !== -1) updated[oldIndex].user = null;
        updated[index].user = { name: currentUser.username, avatar: currentUser.avatar, id: currentUser.id, role: currentUser.role || 'عضو' };
        setRoomSeatsData(updated);
      };

      const leaveSeat = () => {
        const updated = [...roomSeatsData];
        const idx = updated.findIndex(s => s.user?.id === currentUser.id);
        if (idx !== -1 && !updated[idx].isHost) {
          updated[idx].user = null;
          setRoomSeatsData(updated);
        }
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        const emailInput = email.trim();
        const isAdmin = emailInput === ADMIN_EMAIL;
        const permanentId = isAdmin ? "ADMIN-MASTER-ID" : `ID-${Math.floor(100000 + Math.random() * 900000)}`;
        const userRole = isAdmin ? "👑 مدير التطبيق" : "عضو";

        const userObj = {
          id: permanentId,
          username: username || emailInput.split('@')[0],
          email: emailInput,
          password_hash: password,
          coins: 0,
          level: 1,
          role: userRole,
          avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200"
        };

        try {
          if (isSignup) {
            const response = await fetch(`${SUPABASE_BASE_URL}/users`, { method: 'POST', headers: HEADERS, body: JSON.stringify(userObj) });
            if (!response.ok) {
              setErrorMsg("البريد مستخدم مسبقاً");
              return;
            }
          } else {
            const res = await fetch(`${SUPABASE_BASE_URL}/users?email=eq.${encodeURIComponent(emailInput)}`, { headers: HEADERS });
            if (res.ok) {
              const data = await res.json();
              if (data.length > 0) Object.assign(userObj, data[0]);
              else { setErrorMsg("البريد غير مسجل"); return; }
            }
          }
        } catch (e) {
          setErrorMsg("فشل الاتصال بقاعدة البيانات");
          return;
        }

        setCurrentUser(userObj);
        localStorage.setItem('dede_user', JSON.stringify(userObj));
        setShowAuthModal(false);
      };

      const handleCreateRoom = async (e) => {
        e.preventDefault();
        setCreateRoomError('');
        if (!currentUser) return setCreateRoomError('سجل الدخول أولاً');

        const newRoom = {
          id: `ROOM-${Math.floor(1000 + Math.random() * 9000)}`,
          host_id: currentUser.id,
          host_name: currentUser.username,
          host_avatar: currentUser.avatar,
          title: roomTitle,
          category: roomCategory,
          cover_image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=600",
          max_seats: parseInt(roomSeats),
          listeners_count: 1
        };

        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/rooms`, { method: 'POST', headers: HEADERS, body: JSON.stringify(newRoom) });
          if (response.ok) {
            setShowCreateRoomModal(false);
            setRoomTitle('');
            fetchRooms();
          } else { setCreateRoomError("تأكد من البيانات"); }
        } catch (e) { setCreateRoomError("فشل إنشاء الروم"); }
      };

      const totalUnreadCount = Object.keys(unreadFriends).length + friendRequests.length;
      const hasUnreadActivity = totalUnreadCount > 0;
      const isSuperAdmin = currentUser?.email === ADMIN_EMAIL;

      return (
        <div className="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100">
          
          <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-50 shadow-md">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center justify-between w-full sm:w-auto">
                <div className="flex items-center gap-2 cursor-pointer" onClick={() => { setActiveRoom(null); setSearchResult(null); setSearchQuery(''); }}>
                  <div className="w-9 h-9 rounded-xl bg-purple-600 flex items-center justify-center font-black text-lg">🎙️</div>
                  <div>
                    <h1 className="text-lg font-black text-purple-400">DEDE LIVE</h1>
                    <p className="text-[9px] text-slate-400">رومات صوتية مباشرة</p>
                  </div>
                </div>

                {currentUser && (
                  <div className="flex sm:hidden items-center gap-2">
                    <button onClick={() => { fetchFriendData(); setShowSocialModal(true); }} className={`relative bg-slate-800 p-2 rounded-xl ${hasUnreadActivity ? 'border border-rose-500 bell-shake' : ''}`}>
                      💬 {totalUnreadCount > 0 && <span className="absolute -top-1 -right-1 bg-rose-600 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">{totalUnreadCount}</span>}
                    </button>
                    <img src={currentUser.avatar} onClick={() => setShowProfileModal(true)} className="w-9 h-9 rounded-full object-cover ring-2 ring-purple-500" />
                  </div>
                )}
              </div>

              <form onSubmit={handleGlobalSearch} className="flex items-center gap-2 w-full sm:w-auto">
                <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="بحث بـ ID مستخدم أو روم..." className="w-full sm:w-60 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                <button type="submit" className="bg-purple-600 text-white text-xs px-4 py-2 rounded-xl">بحث</button>
              </form>

              <div className="hidden sm:flex items-center gap-3">
                {currentUser ? (
                  <>
                    {isSuperAdmin && <button onClick={() => setShowAdminPanel(true)} className="bg-amber-600 text-white px-3 py-2 rounded-xl text-xs font-black animate-pulse">👑 لوحة الأدمن</button>}
                    <button onClick={() => { fetchFriendData(); setShowSocialModal(true); }} className={`relative bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-bold ${hasUnreadActivity ? 'border border-rose-500 bell-shake' : ''}`}>
                      💬 الرسائل والصداقات {totalUnreadCount > 0 && <span className="absolute -top-1.5 -left-1.5 bg-rose-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center">{totalUnreadCount}</span>}
                    </button>
                    <button onClick={() => setShowCreateRoomModal(true)} className="bg-purple-600 text-white text-xs px-3 py-2 rounded-xl">➕ إنشاء روم</button>
                    <div className="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-xl">
                      <img src={currentUser.avatar} className="w-8 h-8 rounded-full object-cover ring-1 ring-purple-500" />
                      <div>
                        <p className="text-xs font-bold">{currentUser.username}</p>
                        <p className="text-[10px] text-rose-400 font-mono">{currentUser.id}</p>
                      </div>
                      <button onClick={() => setShowProfileModal(true)} className="text-xs bg-slate-700 p-1 rounded-full">✏️</button>
                    </div>
                    <button onClick={() => { setCurrentUser(null); localStorage.removeItem('dede_user'); }} className="text-xs text-rose-400 bg-rose-500/10 px-3 py-2 rounded-xl">خروج</button>
                  </>
                ) : (
                  <button onClick={() => setShowAuthModal(true)} className="bg-purple-600 text-white text-xs px-5 py-2.5 rounded-xl">تسجيل الدخول</button>
                )}
              </div>

              {!currentUser && (
                <div className="flex sm:hidden w-full">
                  <button onClick={() => setShowAuthModal(true)} className="w-full bg-purple-600 text-white text-xs py-2.5 rounded-xl">تسجيل الدخول / حساب جديد</button>
                </div>
              )}

              {currentUser && (
                <div className="flex sm:hidden w-full items-center justify-between pt-2 border-t border-slate-800 text-xs">
                  <span className="text-rose-400 font-mono">{currentUser.id}</span>
                  <div className="flex gap-2">
                    <button onClick={() => { fetchFriendData(); setShowSocialModal(true); }} className="bg-purple-600 px-3 py-1 rounded-lg">الرسائل</button>
                    <button onClick={() => setShowCreateRoomModal(true)} className="bg-pink-600 px-3 py-1 rounded-lg">روم +</button>
                    <button onClick={() => { setCurrentUser(null); localStorage.removeItem('dede_user'); }} className="bg-rose-500/20 text-rose-400 px-3 py-1 rounded-lg">خروج</button>
                  </div>
                </div>
              )}
            </div>
          </header>

          <main className="max-w-6xl w-full mx-auto p-4 flex-1">
            {searchResult ? (
              <div className="bg-slate-900 border border-purple-500/40 rounded-2xl p-4 mb-4">
                <div className="flex justify-between items-center mb-2">
                  <h3 className="text-xs font-bold text-purple-400">نتيجة البحث:</h3>
                  <button onClick={() => setSearchResult(null)} className="text-xs text-slate-400">✕ إغلاق</button>
                </div>
                {searchResult.type === 'room' ? (
                  <div className="flex justify-between items-center bg-slate-950 p-3 rounded-xl">
                    <span className="text-white text-xs font-bold">{searchResult.data.title}</span>
                    <button onClick={() => { enterRoom(searchResult.data); setSearchResult(null); }} className="bg-purple-600 text-xs px-3 py-1.5 rounded-lg">دخول</button>
                  </div>
                ) : (
                  <div className="flex justify-between items-center bg-slate-950 p-3 rounded-xl" onClick={() => setViewingUser(searchResult.data)}>
                    <div className="flex items-center gap-2">
                      <img src={searchResult.data.avatar} className="w-10 h-10 rounded-full object-cover" />
                      <div>
                        <p className="text-xs font-bold text-white">{searchResult.data.username}</p>
                        <p className="text-[10px] text-rose-400 font-mono">{searchResult.data.id}</p>
                      </div>
                    </div>
                    <button className="bg-purple-600 text-xs px-3 py-1.5 rounded-lg">عرض الملف</button>
                  </div>
                )}
              </div>
            ) : searchError ? (
              <div className="bg-rose-500/10 text-rose-300 text-xs p-3 rounded-xl mb-4 text-center">{searchError}</div>
            ) : null}

            {activeRoom ? (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <div className="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
                  <div>
                    <h2 className="text-lg font-black text-white">{activeRoom.title}</h2>
                    <p className="text-xs text-slate-400">المضيف: {activeRoom.host_name}</p>
                  </div>
                  <button onClick={() => setActiveRoom(null)} className="bg-slate-800 text-xs px-3 py-1.5 rounded-xl">خروج</button>
                </div>

                <div className="grid grid-cols-4 sm:grid-cols-8 gap-3 mb-4">
                  {roomSeatsData.map((seat) => (
                    <div key={seat.index} className="flex flex-col items-center">
                      <div onClick={() => seat.user ? setViewingUser(seat.user) : claimSeat(seat.index)} className="w-16 h-16 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center cursor-pointer relative overflow-hidden">
                        {seat.user ? <img src={seat.user.avatar} className="w-full h-full object-cover" /> : <span className="text-slate-600 text-xs">{seat.index + 1}</span>}
                      </div>
                      <p className="text-[10px] text-white mt-1 truncate max-w-[70px]">{seat.user ? seat.user.name : 'فارغ'}</p>
                    </div>
                  ))}
                </div>

                <div className="bg-slate-950 rounded-xl p-3">
                  <h4 className="text-xs text-slate-400 mb-2">دردشة الغرفة</h4>
                  <div className="h-28 overflow-y-auto space-y-1 mb-2 text-xs">
                    {roomChat.map(m => <div key={m.id}><span className="text-purple-400 font-bold">{m.sender}:</span> <span className="text-slate-200">{m.text}</span></div>)}
                  </div>
                  <form onSubmit={e => { e.preventDefault(); if(chatInput.trim()) { setRoomChat([...roomChat, {id: Date.now(), sender: currentUser.username, text: chatInput}]); setChatInput(''); }}} className="flex gap-2">
                    <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="اكتب رسالة..." className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white" />
                    <button type="submit" className="bg-purple-600 text-xs px-3 py-1.5 rounded-xl">إرسال</button>
                  </form>
                </div>
              </div>
            ) : (
              <>
                <div className="bg-gradient-to-r from-purple-900 to-indigo-900 rounded-2xl p-6 mb-6 text-center sm:text-right flex flex-col sm:flex-row justify-between items-center gap-4">
                  <div>
                    <h2 className="text-2xl font-black text-white mb-1">منصة DEDE LIVE</h2>
                    <p className="text-slate-300 text-xs">انضم للرومات الصوتية أو افتح غرفتك الخاصة الآن.</p>
                  </div>
                  {currentUser && <button onClick={() => setShowCreateRoomModal(true)} className="bg-purple-600 text-white text-xs px-5 py-3 rounded-xl whitespace-nowrap">🎙️ فتح روم صوتي</button>}
                </div>

                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-sm font-bold text-white">الرومات النشطة ({rooms.length})</h3>
                  <button onClick={fetchRooms} className="text-xs text-purple-400">🔄 تحديث</button>
                </div>

                {loadingRooms ? (
                  <div className="text-center py-10 text-slate-500 text-xs">جاري التحميل...</div>
                ) : rooms.length === 0 ? (
                  <div className="text-center py-10 text-slate-500 text-xs">لا توجد رومات حالياً.</div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {rooms.map(room => (
                      <div key={room.id} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                        <div className="relative h-32">
                          <img src={room.cover_image} className="w-full h-full object-cover" />
                          <div className="absolute inset-0 bg-gradient-to-t from-slate-950 to-transparent"></div>
                          <div className="absolute bottom-2 right-2 left-2 flex items-center gap-2">
                            <img src={room.host_avatar} className="w-8 h-8 rounded-full object-cover" />
                            <div>
                              <h4 className="text-white text-xs font-bold">{room.title}</h4>
                              <p className="text-[10px] text-slate-400">المضيف: {room.host_name}</p>
                            </div>
                          </div>
                        </div>
                        <div className="p-3 bg-slate-900 flex justify-between items-center text-xs">
                          <span className="text-slate-400">🎙️ {room.max_seats || 8} مقاعد</span>
                          <button onClick={() => enterRoom(room)} className="bg-purple-600 text-white px-3 py-1 rounded-lg">دخول</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}
          </main>

          {/* نافذة الملف الشخصي */}
          {showProfileModal && (
            <div className="fixed inset-0 bg-slate-950/85 z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-xs w-full relative text-center">
                <button onClick={() => setShowProfileModal(false)} className="absolute top-3 left-3 text-slate-400">✕</button>
                <h3 className="text-base font-black text-white mb-3">تعديل الملف الشخصي</h3>
                {profileUpdateMsg && <div className="text-xs text-purple-300 mb-2">{profileUpdateMsg}</div>}
                <form onSubmit={handleSaveProfile} className="space-y-3">
                  <div className="flex flex-col items-center gap-2">
                    <img src={editAvatar || currentUser?.avatar} className="w-20 h-20 rounded-full object-cover ring-2 ring-purple-600" />
                    <label className="bg-purple-600/20 text-purple-300 text-[11px] px-3 py-1.5 rounded-lg cursor-pointer">
                      تغيير الصورة
                      <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                    </label>
                  </div>
                  <input type="text" value={editName} onChange={e => setEditName(e.target.value)} required className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                  <button type="submit" className="w-full bg-purple-600 text-white text-xs py-2.5 rounded-xl">حفظ</button>
                </form>
              </div>
            </div>
          )}

          {/* نافذة الرسائل */}
          {showSocialModal && (
            <div className="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-2">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-3xl h-[85vh] flex flex-col overflow-hidden">
                <div className="bg-slate-950 px-4 py-2.5 flex justify-between items-center border-b border-slate-800">
                  <div className="flex gap-2 text-xs">
                    <button onClick={() => { setActiveTab('messages'); setActivePrivateChat(null); }} className={`px-3 py-1.5 rounded-lg ${activeTab === 'messages' ? 'bg-purple-600 text-white' : 'text-slate-400'}`}>الرسائل</button>
                    <button onClick={() => setActiveTab('requests')} className={`px-3 py-1.5 rounded-lg ${activeTab === 'requests' ? 'bg-purple-600 text-white' : 'text-slate-400'}`}>الطلبات ({friendRequests.length})</button>
                  </div>
                  <button onClick={() => { setShowSocialModal(false); setActivePrivateChat(null); }} className="text-slate-400 text-xs">✕</button>
                </div>

                <div className="flex-1 flex overflow-hidden">
                  {activeTab === 'requests' ? (
                    <div className="flex-1 p-4 overflow-y-auto text-xs space-y-2">
                      {friendRequests.length === 0 ? <p className="text-center text-slate-500 py-10">لا توجد طلبات صداقة.</p> : friendRequests.map(r => (
                        <div key={r.id} className="bg-slate-950 p-3 rounded-xl flex justify-between items-center">
                          <span>{r.sender_name}</span>
                          <div className="flex gap-1">
                            <button onClick={() => respondToFriendRequest(r.id, true)} className="bg-emerald-600 px-3 py-1 rounded-lg">قبول</button>
                            <button onClick={() => respondToFriendRequest(r.id, false)} className="bg-rose-600 px-3 py-1 rounded-lg">رفض</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="flex-1 flex flex-col sm:flex-row overflow-hidden text-xs">
                      <div className={`w-full sm:w-60 bg-slate-950/80 border-l border-slate-800 overflow-y-auto ${activePrivateChat ? 'hidden sm:block' : 'block'}`}>
                        {friendsList.length === 0 ? <p className="p-4 text-slate-500 text-center">لا توجد أصدقاء.</p> : friendsList.map(f => {
                          const friendId = f.sender_id === currentUser.id ? f.receiver_id : f.sender_id;
                          const friendName = f.sender_id === currentUser.id ? (f.receiver_name || "صديق") : f.sender_name;
                          return (
                            <div key={f.id} onClick={() => openPrivateChat(f)} className="p-3 border-b border-slate-900 cursor-pointer hover:bg-slate-900">
                              <p className="font-bold text-white">{friendName}</p>
                              <p className="text-[10px] text-slate-400 truncate">{friendsLastMessages[friendId] || "بدء المحادثة"}</p>
                            </div>
                          );
                        })}
                      </div>

                      <div className={`flex-1 flex flex-col bg-slate-900 ${!activePrivateChat ? 'hidden sm:flex' : 'flex'}`}>
                        {activePrivateChat ? (
                          <>
                            <div className="p-2.5 bg-slate-950 border-b border-slate-800 flex items-center gap-2">
                              <button onClick={() => setActivePrivateChat(null)} className="sm:hidden text-purple-400">←</button>
                              <span className="font-bold text-white">{activePrivateChat.name}</span>
                            </div>
                            <div className="flex-1 overflow-y-auto p-3 space-y-2">
                              {privateMessages.map(m => (
                                <div key={m.id} className={`flex ${m.sender_id === currentUser.id ? 'justify-end' : 'justify-start'}`}>
                                  <div className={`p-2 rounded-xl max-w-[75%] ${m.sender_id === currentUser.id ? 'bg-purple-600 text-white' : 'bg-slate-800 text-slate-100'}`}>
                                    {m.message_text}
                                  </div>
                                </div>
                              ))}
                            </div>
                            <form onSubmit={e => { e.preventDefault(); sendPrivateMessage(privateMsgInput); }} className="p-2 bg-slate-950 border-t border-slate-800 flex gap-2">
                              <input type="text" value={privateMsgInput} onChange={e => setPrivateMsgInput(e.target.value)} placeholder="رسالة..." className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-white" />
                              <button type="submit" className="bg-purple-600 px-3 py-1.5 rounded-xl">إرسال</button>
                            </form>
                          </>
                        ) : (
                          <div className="flex-1 flex items-center justify-center text-slate-500">اختر صديقاً للمراسلة.</div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* نافذة إنشاء روم */}
          {showCreateRoomModal && (
            <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-xs w-full relative">
                <button onClick={() => setShowCreateRoomModal(false)} className="absolute top-3 left-3 text-slate-400">✕</button>
                <h3 className="text-base font-black text-white mb-3 text-center">إنشاء روم صوتي</h3>
                {createRoomError && <div className="text-xs text-rose-400 mb-2 text-center">{createRoomError}</div>}
                <form onSubmit={handleCreateRoom} className="space-y-3 text-xs">
                  <input type="text" value={roomTitle} onChange={e => setRoomTitle(e.target.value)} required placeholder="عنوان الغرفة..." className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                  <select value={roomCategory} onChange={e => setRoomCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                    <option value="حوار ونقاش">حوار ونقاش</option>
                    <option value="موسيقى وغناء">موسيقى وغناء</option>
                    <option value="ألعاب وجيمينج">ألعاب وجيمينج</option>
                  </select>
                  <button type="submit" className="w-full bg-purple-600 text-white py-2.5 rounded-xl">نشر الروم</button>
                </form>
              </div>
            </div>
          )}

          {/* نافذة تسجيل الدخول */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-xs w-full relative">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-3 left-3 text-slate-400">✕</button>
                <h3 className="text-base font-black text-white mb-3 text-center">{isSignup ? 'حساب جديد' : 'تسجيل الدخول'}</h3>
                {errorMsg && <div className="text-xs text-rose-400 mb-2 text-center">{errorMsg}</div>}
                <form onSubmit={handleAuth} className="space-y-3 text-xs">
                  {isSignup && <input type="text" value={username} onChange={e => setUsername(e.target.value)} required placeholder="اسم المستخدم" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />}
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} required placeholder="البريد الإلكتروني" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white" />
                  <input type="password" value="123456" disabled className="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-3 py-2 text-slate-500" title="كلمة المرور مبسطة" />
                  <button type="submit" className="w-full bg-purple-600 text-white py-2.5 rounded-xl">دخول</button>
                </form>
                <p className="text-center text-[11px] text-slate-400 mt-3">
                  <button onClick={() => setIsSignup(!isSignup)} className="text-purple-400">{isSignup ? 'لديك حساب؟ سجل دخول' : 'حساب جديد؟ انضم إلينا'}</button>
                </p>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
