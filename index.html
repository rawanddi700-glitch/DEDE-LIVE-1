<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEDE LIVE - منصة الدردشة الصوتية</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    body { font-family: 'Tajawal', sans-serif; }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.3); opacity: 0; }
    }
    .floating-emoji {
      animation: floatUp 1.5s ease-out forwards;
    }

    @keyframes bellShake {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(14deg); }
      40% { transform: rotate(-14deg); }
      60% { transform: rotate(8deg); }
      80% { transform: rotate(-8deg); }
      100% { transform: rotate(0deg); }
    }
    .bell-shake {
      animation: bellShake 0.6s ease-in-out infinite;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_BASE_URL = "https://yhsehpcosswgehonzzcq.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_cbpNPEi4PWw8aKIjPN7HMg_zN2sChHr";
    const ADMIN_EMAIL = "zzx640616@gmail.com";

    const HEADERS = {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': 'return=representation'
    };

    const playNotificationSound = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const audioCtx = new AudioContext();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.45);
      } catch (e) {
        console.log("Audio Context blocked");
      }
    };

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('dede_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      
      const [rooms, setRooms] = useState([]);
      const [loadingRooms, setLoadingRooms] = useState(true);
      
      const [activeRoom, setActiveRoom] = useState(null);
      const [roomSeatsData, setRoomSeatsData] = useState([]);
      const [isMuted, setIsMuted] = useState(false);
      
      const [roomChat, setRoomChat] = useState([]);
      const [chatInput, setChatInput] = useState('');
      const [floatingEmojis, setFloatingEmojis] = useState([]);

      const [searchQuery, setSearchQuery] = useState('');
      const [searchResult, setSearchResult] = useState(null);
      const [searchError, setSearchError] = useState('');

      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [isSignup, setIsSignup] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const [showCreateRoomModal, setShowCreateRoomModal] = useState(false);
      const [roomTitle, setRoomTitle] = useState('');
      const [roomCategory, setRoomCategory] = useState('حوار ونقاش');
      const [roomSeats, setRoomSeats] = useState(8);
      const [createRoomError, setCreateRoomError] = useState('');

      const [showProfileModal, setShowProfileModal] = useState(false);
      const [editName, setEditName] = useState('');
      const [editAvatar, setEditAvatar] = useState('');
      const [profileUpdateMsg, setProfileUpdateMsg] = useState('');

      // لوحة الأدمن (شام كاش)
      const [showAdminPanel, setShowAdminPanel] = useState(false);

      // متغيرات التواصل والأصدقاء والشات
      const [viewingUser, setViewingUser] = useState(null);
      const [friendRequests, setFriendRequests] = useState([]);
      const [friendsList, setFriendsList] = useState([]);
      const [showSocialModal, setShowSocialModal] = useState(false);
      const [activeTab, setActiveTab] = useState('messages');
      const [activePrivateChat, setActivePrivateChat] = useState(null);
      const [privateMessages, setPrivateMessages] = useState([]);
      const [privateMsgInput, setPrivateMsgInput] = useState('');
      const [actionMsg, setActionMsg] = useState('');
      const [showEmojiPicker, setShowEmojiPicker] = useState(false);
      const [friendsLastMessages, setFriendsLastMessages] = useState({});
      const [unreadFriends, setUnreadFriends] = useState({});

      const chatScrollRef = useRef(null);
      const prevReqCountRef = useRef(0);
      const prevTotalMsgsCountRef = useRef(0);

      useEffect(() => {
        fetchRooms();
        if (currentUser) {
          fetchFriendData();
          const interval = setInterval(() => {
            fetchFriendData();
            if (activePrivateChat) {
              fetchPrivateMessages(activePrivateChat.id, false);
            }
          }, 3000);
          return () => clearInterval(interval);
        }
      }, [currentUser, activePrivateChat]);

      useEffect(() => {
        if (chatScrollRef.current) {
          chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
        }
      }, [privateMessages]);

      const fetchFriendData = async () => {
        if (!currentUser) return;
        try {
          const reqRes = await fetch(`${SUPABASE_BASE_URL}/friendships?receiver_id=eq.${encodeURIComponent(currentUser.id)}&status=eq.pending`, { headers: HEADERS });
          if (reqRes.ok) {
            const reqs = await reqRes.json();
            if (reqs.length > prevReqCountRef.current) {
              playNotificationSound();
            }
            prevReqCountRef.current = reqs.length;
            setFriendRequests(reqs);
          }

          const friendsRes = await fetch(`${SUPABASE_BASE_URL}/friendships?or=(sender_id.eq.${encodeURIComponent(currentUser.id)},receiver_id.eq.${encodeURIComponent(currentUser.id)})&status=eq.accepted`, { headers: HEADERS });
          if (friendsRes.ok) {
            const fList = await friendsRes.json();
            setFriendsList(fList);

            const lastMsgsMap = {};
            const newUnreadMap = { ...unreadFriends };
            let totalNewActivity = 0;

            for (let f of fList) {
              const friendId = f.sender_id === currentUser.id ? f.receiver_id : f.sender_id;
              const msgRes = await fetch(`${SUPABASE_BASE_URL}/private_messages?or=(and(sender_id.eq.${encodeURIComponent(currentUser.id)},receiver_id.eq.${encodeURIComponent(friendId)}),and(sender_id.eq.${encodeURIComponent(friendId)},receiver_id.eq.${encodeURIComponent(currentUser.id)}))&order=created_at.desc&limit=1`, { headers: HEADERS });
              
              if (msgRes.ok) {
                const msgData = await msgRes.json();
                if (msgData.length > 0) {
                  const lastMsg = msgData[0];
                  lastMsgsMap[friendId] = lastMsg.message_text;

                  if (lastMsg.sender_id !== currentUser.id && (!activePrivateChat || activePrivateChat.id !== friendId)) {
                    newUnreadMap[friendId] = true;
                    totalNewActivity++;
                  }
                } else {
                  lastMsgsMap[friendId] = "ابدأ المحادثة الآن...";
                }
              }
            }

            setFriendsLastMessages(lastMsgsMap);
            setUnreadFriends(newUnreadMap);

            if ((totalNewActivity > prevTotalMsgsCountRef.current || reqs.length > 0) && prevTotalMsgsCountRef.current !== -1) {
              playNotificationSound();
            }
            prevTotalMsgsCountRef.current = totalNewActivity;
          }
        } catch (err) {
          console.error("Error fetching friend data:", err);
        }
      };

      // تعبئة حقول التعديل بالاسم الحالي للمستخدم عند فتح نافذة البروفايل
      useEffect(() => {
        if (currentUser && showProfileModal) {
          setEditName(currentUser.username || '');
          setEditAvatar(currentUser.avatar || '');
        }
      }, [showProfileModal, currentUser]);

      const fetchRooms = async () => {
        setLoadingRooms(true);
        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/rooms?select=*`, { headers: HEADERS });
          if (response.ok) {
            const data = await response.json();
            setRooms(data);
          }
        } catch (err) {
          console.error("Error fetching rooms:", err);
        } finally {
          setLoadingRooms(false);
        }
      };

      const handleGlobalSearch = async (e) => {
        e.preventDefault();
        setSearchError('');
        setSearchResult(null);

        const query = searchQuery.trim();
        if (!query) return;

        const foundRoom = rooms.find(r => r.id.toLowerCase() === query.toLowerCase());
        if (foundRoom) {
          setSearchResult({ type: 'room', data: foundRoom });
          return;
        }

        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/users?or=(id.ilike.*${query}*,username.ilike.*${query}*)`, { headers: HEADERS });
          if (res.ok) {
            const users = await res.json();
            if (users.length > 0) {
              setSearchResult({ type: 'user', data: users[0] });
              return;
            }
          }
        } catch (err) {
          console.error("Search user error:", err);
        }

        setSearchError('عذراً، لم يتم العثور على أي مطابقة للـ ID أو الاسم المدخل.');
      };

      const sendFriendRequest = async (targetUser) => {
        if (!currentUser) return alert("سجل الدخول أولاً لإرسال طلب صداقة!");
        if (currentUser.id === targetUser.id) return alert("لا يمكنك إرسال طلب صداقة لنفسك!");
        
        setActionMsg("جاري إرسال الطلب...");
        try {
          const payload = {
            sender_id: currentUser.id,
            sender_name: currentUser.username,
            receiver_id: targetUser.id,
            status: 'pending'
          };
          const res = await fetch(`${SUPABASE_BASE_URL}/friendships`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            setActionMsg("تم إرسال طلب الصداقة بنجاح! 🟢");
          } else {
            setActionMsg("تم إرسال طلب مسبقاً لهذا المستخدم.");
          }
        } catch (err) {
          setActionMsg("فشل الاتصال بالسيرفر.");
        }
      };

      const respondToFriendRequest = async (reqId, accept) => {
        try {
          if (accept) {
            await fetch(`${SUPABASE_BASE_URL}/friendships?id=eq.${reqId}`, {
              method: 'PATCH',
              headers: HEADERS,
              body: JSON.stringify({ status: 'accepted' })
            });
          } else {
            await fetch(`${SUPABASE_BASE_URL}/friendships?id=eq.${reqId}`, {
              method: 'DELETE',
              headers: HEADERS
            });
          }
          fetchFriendData();
        } catch (err) {
          console.error("Error responding to request:", err);
        }
      };

      const openPrivateChat = async (friend) => {
        const friendId = friend.sender_id === currentUser.id ? friend.receiver_id : friend.sender_id;
        const friendName = friend.sender_id === currentUser.id ? (friend.receiver_name || "صديق") : friend.sender_name;
        
        setActivePrivateChat({ id: friendId, name: friendName });
        
        setUnreadFriends(prev => {
          const updated = { ...prev };
          delete updated[friendId];
          return updated;
        });

        fetchPrivateMessages(friendId, true);
      };

      const fetchPrivateMessages = async (friendId, initial = false) => {
        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/private_messages?or=(and(sender_id.eq.${encodeURIComponent(currentUser.id)},receiver_id.eq.${encodeURIComponent(friendId)}),and(sender_id.eq.${encodeURIComponent(friendId)},receiver_id.eq.${encodeURIComponent(currentUser.id)}))&order=created_at.asc`, { headers: HEADERS });
          if (res.ok) {
            const msgs = await res.json();
            if (!initial && msgs.length > privateMessages.length) {
              const lastMsg = msgs[msgs.length - 1];
              if (lastMsg && lastMsg.sender_id !== currentUser.id) {
                playNotificationSound();
              }
            }
            setPrivateMessages(msgs);
          }
        } catch (err) {
          console.error("Error fetching private msgs:", err);
        }
      };

      const sendPrivateMessage = async (textToSend, type = 'text') => {
        if (!textToSend.trim() || !activePrivateChat) return;

        const payload = {
          sender_id: currentUser.id,
          receiver_id: activePrivateChat.id,
          message_text: textToSend.trim()
        };

        try {
          const res = await fetch(`${SUPABASE_BASE_URL}/private_messages`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            if (type === 'text') setPrivateMsgInput('');
            setShowEmojiPicker(false);
            fetchPrivateMessages(activePrivateChat.id, false);
            fetchFriendData();
          }
        } catch (err) {
          console.error("Error sending private message:", err);
        }
      };

      const handleImageChatUpload = (e) => {
        const file = e.target.files[0];
        if (file && activePrivateChat) {
          const reader = new FileReader();
          reader.onloadend = () => {
            sendPrivateMessage(`[🖼️ صورة مرفقة]`, 'image');
          };
          reader.readAsDataURL(file);
        }
      };

      const sendVoiceNote = () => {
        if (!activePrivateChat) return;
        sendPrivateMessage("🎤 [مقطع صوتي مسجل - 0:12]", 'voice');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setEditAvatar(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      // دالة حفظ التعديلات الشخصية (المستخدم يغير اسمه وصورته بحرية تامة)
      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        setProfileUpdateMsg('جاري تحديث الاسم...');

        const newUsername = editName.trim();
        const newAvatar = editAvatar || currentUser.avatar;

        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/users?email=eq.${encodeURIComponent(currentUser.email)}`, {
            method: 'PATCH',
            headers: HEADERS,
            body: JSON.stringify({
              username: newUsername,
              avatar: newAvatar
            })
          });

          if (response.ok) {
            const updatedUser = { ...currentUser, username: newUsername, avatar: newAvatar };
            setCurrentUser(updatedUser);
            localStorage.setItem('dede_user', JSON.stringify(updatedUser));
            setProfileUpdateMsg('تم تحديث الاسم بنجاح! ✅');
            setTimeout(() => {
              setShowProfileModal(false);
              setProfileUpdateMsg('');
            }, 1000);
          } else {
            setProfileUpdateMsg("تعذر تحديث البيانات");
          }
        } catch (err) {
          setProfileUpdateMsg("فشل الاتصال بالسيرفر");
        }
      };

      const enterRoom = (room) => {
        setActiveRoom(room);
        const seatsCount = room.max_seats || 8;
        const initialSeats = Array.from({ length: seatsCount }, (_, i) => {
          if (i === 0) {
            return { 
              index: 0, 
              user: { name: room.host_name, avatar: room.host_avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200", id: room.host_id, role: 'مضيف الغرفة' }, 
              isHost: true 
            };
          }
          return { index: i, user: null, isHost: false };
        });
        setRoomSeatsData(initialSeats);
        setRoomChat([
          { id: 1, sender: 'النظام 🤖', text: `أهلاً بك في روم "${room.title}".` }
        ]);
        setIsMuted(false);
      };

      const claimSeat = (index) => {
        if (!currentUser) return alert("يجب تسجيل الدخول أولاً للصعود إلى المايك!");
        const updated = [...roomSeatsData];
        if (updated[index].user) return;

        const oldIndex = updated.findIndex(s => s.user?.id === currentUser.id);
        if (oldIndex !== -1) updated[oldIndex].user = null;

        updated[index].user = { 
          name: currentUser.username, 
          avatar: currentUser.avatar, 
          id: currentUser.id, 
          role: currentUser.role || 'عضو' 
        };
        setRoomSeatsData(updated);
      };

      const leaveSeat = () => {
        const updated = [...roomSeatsData];
        const idx = updated.findIndex(s => s.user?.id === currentUser.id);
        if (idx !== -1 && !updated[idx].isHost) {
          updated[idx].user = null;
          setRoomSeatsData(updated);
        }
      };

      const kickUser = (index) => {
        if (activeRoom.host_id !== currentUser?.id) return alert("فقط مضيف الغرفة يمكنه طرد الأعضاء!");
        const updated = [...roomSeatsData];
        if (updated[index].isHost) return alert("لا يمكنك طرد مضيف الغرفة!");
        const target = updated[index].user;
        if (target) {
          updated[index].user = null;
          setRoomSeatsData(updated);
          setRoomChat(prev => [...prev, { id: Date.now(), sender: 'تنبيه ⚠️', text: `تم طرد ${target.name} من المايك.` }]);
        }
      };

      const sendRoomChat = (e) => {
        e.preventDefault();
        if (!chatInput.trim() || !currentUser) return;
        setRoomChat(prev => [...prev, { id: Date.now(), sender: currentUser.username, text: chatInput }]);
        setChatInput('');
      };

      const sendEmoji = (emoji) => {
        const id = Date.now();
        setFloatingEmojis(prev => [...prev, { id, emoji }]);
        setTimeout(() => {
          setFloatingEmojis(prev => prev.filter(item => item.id !== id));
        }, 1500);
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setErrorMsg('');

        const localDeviceUser = localStorage.getItem('dede_device_registered');
        if (isSignup && localDeviceUser) {
          setErrorMsg("عذراً، لا يمكنك إنشاء أكثر من حساب واحد من هذا الجهاز أو المتصفح!");
          return;
        }

        const emailInput = email.trim();
        const isAdmin = emailInput === ADMIN_EMAIL;
        const permanentId = isAdmin ? "ADMIN-MASTER-ID" : `ID-${Math.floor(100000 + Math.random() * 900000)}`;
        const userRole = isAdmin ? "👑 مدير التطبيق" : "عضو";

        const userObj = {
          id: permanentId,
          username: username || emailInput.split('@')[0],
          email: emailInput,
          password_hash: password,
          coins: 0,
          level: 1,
          role: userRole,
          avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=200"
        };

        try {
          if (isSignup) {
            const response = await fetch(`${SUPABASE_BASE_URL}/users`, {
              method: 'POST',
              headers: HEADERS,
              body: JSON.stringify(userObj)
            });

            if (!response.ok) {
              const errData = await response.json();
              setErrorMsg("خطأ: " + (errData.message || "البريد مستخدم مسبقاً"));
              return;
            }
            localStorage.setItem('dede_device_registered', 'true');
          } else {
            const res = await fetch(`${SUPABASE_BASE_URL}/users?email=eq.${encodeURIComponent(emailInput)}`, { headers: HEADERS });
            if (res.ok) {
              const data = await res.json();
              if (data.length > 0) {
                Object.assign(userObj, data[0]);
              } else {
                setErrorMsg("البريد غير مسجل أو كلمة المرور خاطئة");
                return;
              }
            }
          }
        } catch (err) {
          setErrorMsg("فشل الاتصال بقاعدة البيانات");
          return;
        }

        setCurrentUser(userObj);
        localStorage.setItem('dede_user', JSON.stringify(userObj));
        setShowAuthModal(false);
      };

      const handleCreateRoom = async (e) => {
        e.preventDefault();
        setCreateRoomError('');

        if (!currentUser) {
          setCreateRoomError('يجب تسجيل الدخول أولاً');
          return;
        }

        const newRoom = {
          id: `ROOM-${Math.floor(1000 + Math.random() * 9000)}`,
          host_id: currentUser.id,
          host_name: currentUser.username,
          host_avatar: currentUser.avatar,
          title: roomTitle,
          category: roomCategory,
          cover_image: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=600",
          max_seats: parseInt(roomSeats),
          listeners_count: 1
        };

        try {
          const response = await fetch(`${SUPABASE_BASE_URL}/rooms`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify(newRoom)
          });

          if (response.ok) {
            setShowCreateRoomModal(false);
            setRoomTitle('');
            fetchRooms();
          } else {
            const errData = await response.json();
            setCreateRoomError("خطأ: " + (errData.message || "تأكد من البيانات"));
          }
        } catch (err) {
          setCreateRoomError("فشل في الاتصال أثناء إنشاء الروم");
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('dede_user');
      };

      const totalUnreadCount = Object.keys(unreadFriends).length + friendRequests.length;
      const hasUnreadActivity = totalUnreadCount > 0;
      const isSuperAdmin = currentUser?.email === ADMIN_EMAIL;

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4 sticky top-0 z-50 shadow-md">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setActiveRoom(null); setSearchResult(null); setSearchQuery(''); }}>
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-black text-xl shadow-lg shadow-purple-500/30">
                🎙️
              </div>
              <div>
                <h1 className="text-xl font-black bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">DEDE LIVE</h1>
                <p className="text-[10px] text-purple-400 font-bold">بث مباشر ورومات حية</p>
              </div>
            </div>

            <form onSubmit={handleGlobalSearch} className="flex items-center gap-2 w-full md:w-auto">
              <input 
                type="text" 
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                placeholder="ابحث بـ ID مستخدم أو ID روم..."

                              <div className="flex gap-2">
                                <button onClick={() => respondToFriendRequest(req.id, true)} className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-xl">قبول</button>
                                <button onClick={() => respondToFriendRequest(req.id, false)} className="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-4 py-2 rounded-xl">رفض</button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="flex-1 flex overflow-hidden">
                      <div className="w-full md:w-80 bg-slate-950/80 border-l border-slate-800 flex flex-col h-full">
                        <div className="p-3 border-b border-slate-800">
                          <h4 className="text-xs font-bold text-slate-400">الأصدقاء والمحادثات ({friendsList.length})</h4>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-1.5">
                          {friendsList.length === 0 ? (
                            <p className="text-xs text-slate-500 p-6 text-center">ليس لديك أصدقاء بعد لإرسال رسائل لهم.</p>
                          ) : (
                            friendsList.map(f => {
                              const friendId = f.sender_id === currentUser.id ? f.receiver_id : f.sender_id;
                              const friendName = f.sender_id === currentUser.id ? (f.receiver_name || "صديق") : f.sender_name;
                              const isSelected = activePrivateChat?.id === friendId;
                              const lastMessageText = friendsLastMessages[friendId] || "انقر لبدء الدردشة...";
                              const isUnread = unreadFriends[friendId];

                              return (
                                <div 
                                  key={f.id} 
                                  onClick={() => openPrivateChat(f)}
                                  className={`p-3 rounded-2xl cursor-pointer border transition-all flex items-center gap-3 ${
                                    isSelected 
                                      ? 'bg-purple-600/20 border-purple-500 shadow' 
                                      : isUnread 
                                        ? 'bg-rose-950/30 border-rose-500/60 shadow-lg' 
                                        : 'bg-slate-900/60 border-slate-800 hover:bg-slate-800/50'
                                  }`}>
                                  <div className="w-11 h-11 rounded-full bg-purple-600 flex items-center justify-center font-black text-sm text-white ring-2 ring-purple-500/40 shrink-0 relative">
                                    {friendName.charAt(0)}
                                    {isUnread && (
                                      <span className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-rose-600 rounded-full border-2 border-slate-950 animate-pulse"></span>
                                    )}
                                  </div>
                                  <div className="flex-1 truncate">
                                    <p className={`text-xs font-bold truncate ${isUnread ? 'text-rose-400 font-black' : 'text-white'}`}>{friendName}</p>
                                    <p className={`text-[11px] truncate mt-0.5 ${isUnread ? 'text-rose-300 font-bold' : 'text-slate-400'}`}>{lastMessageText}</p>
                                  </div>
                                </div>
                              );
                            })
                          )}
                        </div>
                      </div>

                      <div className="flex-1 flex flex-col bg-slate-900 h-full">
                        {activePrivateChat ? (
                          <>
                            <div className="p-3.5 border-b border-slate-800 bg-slate-950/60 flex items-center justify-between">
                              <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-full bg-purple-600 flex items-center justify-center font-black text-white text-sm">
                                  {activePrivateChat.name.charAt(0)}
                                </div>
                                <h4 className="text-sm font-black text-white">{activePrivateChat.name}</h4>
                              </div>
                            </div>

                            <div ref={chatScrollRef} className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-950/40">
                              {privateMessages.length === 0 ? (
                                <div className="text-center py-24 text-slate-500 text-xs">
                                  <p className="text-2xl mb-2">👋</p>
                                  ابدأ المحادثة الآن!
                                </div>
                              ) : (
                                privateMessages.map(msg => {
                                  const isMe = msg.sender_id === currentUser.id;
                                  const isImage = msg.message_text.startsWith('[🖼️ صورة مرفقة]');
                                  const isVoice = msg.message_text.startsWith('🎤');

                                  return (
                                    <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                      <div className={`p-3 rounded-2xl max-w-[75%] text-xs leading-relaxed shadow-md ${
                                        isMe ? 'bg-purple-600 text-white rounded-bl-none' : 'bg-slate-800 text-slate-100 rounded-br-none border border-slate-700'
                                      }`}>
                                        {isImage ? (
                                          <div className="space-y-1">
                                            <p className="font-bold text-[10px] opacity-80">صورة مرفقة:</p>
                                            <img src={msg.message_text.replace('[🖼️ صورة مرفقة]\n', '')} className="rounded-xl max-w-full h-auto max-h-48 object-cover ring-1 ring-white/20" />
                                          </div>
                                        ) : isVoice ? (
                                          <div className="flex items-center gap-2 font-bold py-1">
                                            <span>🎤 مقطع صوتي</span>
                                            <span className="bg-white/20 px-2 py-0.5 rounded text-[10px]">0:12</span>
                                          </div>
                                        ) : (
                                          <p className="break-words">{msg.message_text}</p>
                                        )}
                                      </div>
                                    </div>
                                  );
                                })
                              )}
                            </div>

                            <div className="p-3 bg-slate-950 border-t border-slate-800 relative">
                              {showEmojiPicker && (
                                <div className="absolute bottom-16 right-3 bg-slate-900 border border-slate-700 p-3 rounded-2xl shadow-2xl flex gap-2 z-30">
                                  {['❤️', '🔥', '😂', '👍', '🎉', '😍', '✨', '🙏', '😎', '🌹'].map(emoji => (
                                    <button 
                                      key={emoji} 
                                      type="button" 
                                      onClick={() => { setPrivateMsgInput(prev => prev + emoji); setShowEmojiPicker(false); }}
                                      className="text-xl hover:scale-125 transition-transform p-1">
                                      {emoji}
                                    </button>
                                  ))}
                                </div>
                              )}

                              <form onSubmit={(e) => { e.preventDefault(); sendPrivateMessage(privateMsgInput, 'text'); }} className="flex items-center gap-2">
                                <button 
                                  type="button" 
                                  onClick={() => setShowEmojiPicker(!showEmojiPicker)} 
                                  className="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl text-sm transition-all" title="سمايلات">
                                  😊
                                </button>

                                <label className="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl text-sm cursor-pointer transition-all" title="إرسال صورة">
                                  📷
                                  <input type="file" accept="image/*" onChange={handleImageChatUpload} className="hidden" />
                                </label>

                                <button 
                                  type="button" 
                                  onClick={sendVoiceNote} 
                                  className="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl text-sm transition-all" title="تسجيل صوتي">
                                  🎤
                                </button>

                                <input 
                                  type="text" 
                                  value={privateMsgInput} 
                                  onChange={e => setPrivateMsgInput(e.target.value)} 
                                  placeholder="اكتب رسالة احترافية..." 
                                  className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500 shadow-inner" 
                                />

                                <button type="submit" className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-lg transition-all">
                                  إرسال ✈️
                                </button>
                              </form>
                            </div>
                          </>
                        ) : (
                          <div className="flex-1 flex flex-col items-center justify-center text-slate-500 p-6 text-center">
                            <div className="w-16 h-16 rounded-2xl bg-slate-800 flex items-center justify-center text-3xl mb-3 shadow-inner">💬</div>
                            <h4 className="text-white font-bold text-sm mb-1">اختر صديقاً من القائمة الجانبية لبدء المحادثة</h4>
                            <p className="text-xs text-slate-400">تواصل بحرية تامة مع أصدقائك بالرسائل والصور والمقاطع الصوتية.</p>
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

          {/* نافذة تعديل الملف الشخصي (المستخدم يغير اسمه بحرية تامة) */}
          {showProfileModal && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full relative shadow-2xl">
                <button onClick={() => setShowProfileModal(false)} className="absolute top-5 left-5 text-slate-400 hover:text-white text-lg">✕</button>
                
                <h3 className="text-2xl font-black text-white text-center mb-1">الملف الشخصي</h3>
                <p className="text-xs text-slate-400 text-center mb-6">تغيير اسم المستخدم وصورتك الشخصية</p>

                {profileUpdateMsg && (
                  <div className="mb-4 bg-purple-500/10 text-purple-300 text-xs p-2.5 rounded-xl text-center font-bold">
                    {profileUpdateMsg}
                  </div>
                )}

                <form onSubmit={handleSaveProfile} className="space-y-6">
                  <div className="flex flex-col items-center gap-3">
                    <img src={editAvatar || currentUser?.avatar} className="w-28 h-28 rounded-full object-cover ring-4 ring-purple-600 shadow-2xl" />
                    <label className="bg-purple-600/20 hover:bg-purple-600 text-purple-300 hover:text-white text-xs font-bold px-4 py-2 rounded-xl cursor-pointer border border-purple-500/30 transition-all shadow">
                      📂 تغيير الصورة الشخصية
                      <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                    </label>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-2">اسم المستخدم الخاص بك (يمكنك تعديله بحرية)</label>
                    <input 
                      type="text" 
                      value={editName} 
                      onChange={e => setEditName(e.target.value)} 
                      required 
                      className="w-full bg-slate-950 border border-slate-700 rounded-2xl px-5 py-3 text-base font-black text-white focus:outline-none focus:border-purple-500 shadow-inner" 
                    />
                  </div>

                  <div className="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="text-xs text-slate-400 font-bold">🆔 الـ ID المميز:</span>
                      <span className="font-mono text-rose-500 font-black text-base tracking-wider">{currentUser?.id}</span>
                    </div>
                    <div className="flex justify-between items-center">
                      <span className="text-xs text-slate-400 font-bold">⭐ الرتبة (تُدار من قِبل الأدمن):</span>
                      <span className="bg-rose-500/20 text-rose-400 px-3 py-1 rounded-lg font-black text-xs border border-rose-500/40">{currentUser?.role || 'عضو'}</span>
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-90 text-white font-black py-3.5 rounded-2xl text-sm shadow-xl transition-all">
                    حفظ الاسم الجديد
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* نافذة إنشاء روم */}
          {showCreateRoomModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full relative shadow-2xl">
                <button onClick={() => setShowCreateRoomModal(false)} className="absolute top-4 left-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-black text-white text-center mb-1">إنشاء روم صوتي</h3>
                {createRoomError && (
                  <div className="mb-4 bg-rose-500/10 text-rose-300 text-xs p-2.5 rounded-xl text-center font-bold">
                    {createRoomError}
                  </div>
                )}
                <form onSubmit={handleCreateRoom} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">عنوان الروم</label>
                    <input type="text" value={roomTitle} onChange={e => setRoomTitle(e.target.value)} required placeholder="عنوان الغرفة..." className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">التصنيف</label>
                    <select value={roomCategory} onChange={e => setRoomCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                      <option value="حوار ونقاش">حوار ونقاش</option>
                      <option value="موسيقى وغناء">موسيقى وغناء</option>
                      <option value="ألعاب وجيمينج">ألعاب وجيمينج</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">المقاعد</label>
                    <select value={roomSeats} onChange={e => setRoomSeats(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                      <option value="4">4 مقاعد</option>
                      <option value="8">8 مقاعد</option>
                      <option value="12">12 مقعد</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-xs">نشر الروم</button>
                </form>
              </div>
            </div>
          )}

          {/* نافذة تسجيل الدخول */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full relative shadow-2xl">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 left-4 text-slate-400 hover:text-white">✕</button>
                <h3 className="text-xl font-black text-white text-center mb-1">{isSignup ? 'حساب جديد' : 'تسجيل الدخول'}</h3>
                {errorMsg && <div className="mb-4 bg-rose-500/10 text-rose-300 text-xs p-2.5 rounded-xl text-center font-bold">{errorMsg}</div>}
                <form onSubmit={handleAuth} className="space-y-4">
                  {isSignup && (
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">اسم المستخدم</label>
                      <input type="text" value={username} onChange={e => setUsername(e.target.value)} required placeholder="اسمك..." className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                    </div>
                  )}
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">البريد الإلكتروني</label>
                    <input type="email" value={email} onChange={e => setEmail(e.target.value)} required placeholder="email@example.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">كلمة السر</label>
                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} required placeholder="••••••••" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-purple-500" />
                  </div>
                  <button type="submit" className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl text-xs">دخول</button>
                </form>
                <p className="text-center text-xs text-slate-400 mt-4">
                  <button onClick={() => setIsSignup(!isSignup)} className="text-purple-400 font-bold hover:underline">
                    {isSignup ? 'لديك حساب؟ تسجيل الدخول' : 'ليس لديك حساب؟ إنشاء حساب'}
                  </button>
                </p>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-800 py-6 bg-slate-900/50 mt-12 text-center text-xs text-slate-400">
            DEDE LIVE © 2026 - جميع الحقوق محفوظة
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
